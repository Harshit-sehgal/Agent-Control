# Agent Control kept running on a machine of your own, reached over Tailscale.
#
#   docker compose --env-file .env -p agent-control -f deploy/compose.tailscale.yaml up -d --build
#   tailscale serve --bg 4173
#
# `--env-file .env` matters: compose interpolates `${PUBLIC_ORIGIN}` below from
# the project directory (the one holding this file), not from the repository, so
# without it a URL set in the repository's .env is ignored and the app names its
# Tailscale host as its public origin. Run from the repository root for that
# relative path; from inside deploy/ pass `--env-file ../.env`.
#
# Tailscale provides HTTPS at https://<machine>.<tailnet>.ts.net, to your own
# devices only. Set TS_HOST to that name. The app uses the host's network and
# listens on loopback, so nothing else can reach it, and it can call an AI
# gateway running on this machine. Settings come from the repository's .env;
# data stays in the repository's data/ folder.
#
# Reached through a Cloudflare Tunnel instead (or as well)? Set PUBLIC_ORIGIN to
# the URL people actually open, e.g. PUBLIC_ORIGIN=https://app.example.com; the
# Tailscale name is only the default.
services:
  app:
    build:
      context: ..
      args:
        # The browser a bot may use (`browser.use`) inside this container. Its
        # hosts still have to be listed in AGENT_BROWSER_ALLOWLIST; without that
        # variable a request falls back to a paired local agent.
        INSTALL_BROWSER: "1"
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    environment:
      HOST: 127.0.0.1
      PORT: "4173"
      DATA_FILE: /data/state.json
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${TS_HOST:?Set TS_HOST to this machine's Tailscale name}}
    volumes:
      - ../data:/data
