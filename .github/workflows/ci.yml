name: tests
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      # The Pages workflow deploys docs/ straight from the commit, so a stale
      # bundle would silently ship. Rebuild it and fail if the checked-in copy
      # does not match, instead of letting the deploy overwrite the difference.
      - name: Verify the committed Pages bundle matches shared/
        run: |
          npm run build:pages
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "docs/ is stale. Run 'npm run build:pages' and commit the result."
            git --no-pager diff --stat docs
            exit 1
          fi

  # The Node suite imports modules; this job drives the real server in a real
  # browser, which is the only layer that catches a stale runtime, a key the
  # server rejects, or a session that never reaches the queue. The two visual
  # smokes (polish, usability) stay local: they assert layout, and CI fonts make
  # those assertions the flaky kind of truthful.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - run: pip install playwright
      # The runner image already has Chromium's system libraries. When its apt mirror
      # cannot be resolved, apt retries for minutes; fall back to the browser alone.
      - run: timeout 240 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Live end-to-end (real server, stub model, real browser)
        run: python tests/live_smoke.py
