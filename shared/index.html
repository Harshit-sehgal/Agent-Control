<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb">
<meta name="description" content="Agent Control: manage your bot groups, chat with bots, and review X-engage drafts.">
<title>Agent Control — Your bot workspace</title>
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./polish.css">

<div id="root" class="app-layout">
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation"></aside>

    <header class="topbar" id="topbar"></header>
