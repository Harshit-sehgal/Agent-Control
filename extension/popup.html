<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Capture</title><style>body{font:13px system-ui;width:330px;margin:0;background:#111827;color:#e9eefb;padding:17px}h2{margin:0 0 6px}p{font-size:12px;line-height:1.5;color:#a0acc6}label{display:block;font-size:11px;margin-top:13px}input,textarea{width:100%;margin-top:5px;box-sizing:border-box;background:#0a1222;border:1px solid #455673;color:#fff;border-radius:7px;padding:9px}textarea{resize:vertical}button{width:100%;margin-top:13px;padding:11px;background:#b6c8ff;color:#111c32;font-weight:650;border:0;border-radius:8px;cursor:pointer}#msg{font-size:11px;line-height:1.5;color:#9fdbb5;margin-top:12px;overflow-wrap:anywhere}.tip{border-left:2px solid #9eb7f2;padding-left:10px}</style></head><body><h2>◈ Agent Capture</h2><p>Capture one visible post after selecting it. Your dashboard prepares the draft; you click Post yourself.</p><label>Dashboard URL<input id="endpoint" value="http://127.0.0.1:4173" placeholder="https://dashboard.example.com"></label><label>Capture token<input id="token" type="password" placeholder="From Dashboard → Settings"></label><label>Topic (optional)<input id="topic" placeholder="AI, robotics..."></label><p class="tip">On X, highlight text from the post you want to capture, then open this extension. On the demo feed, select text inside one card.</p><button id="capture">Capture selected post</button><p id="msg"></p><script src="popup.js"></script></body></html>
