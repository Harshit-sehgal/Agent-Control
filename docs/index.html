<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<meta name="description" content="Agent Control: a local-first workspace for your bot groups, conversations and approvals.">
<meta name="agent-backend" content="static">
<!-- Mirrors the Node server's CSP header so the static Pages build is protected too. Keep the two in sync. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<title>Agent Control — Your bot workspace</title>
<link rel="stylesheet" href="./app.css?v=b22a42e620">
<link rel="stylesheet" href="./polish.css?v=b22a42e620">
<link rel="stylesheet" href="./usability.css?v=b22a42e620">
</head><body>
<div id="root" class="app-layout">
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation"></aside>
  <div class="app-area">
    <header class="topbar" id="topbar"></header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <aside id="inspector" class="inspector" aria-label="Context panel"></aside>
</div>
<div id="modal" class="modal-layer hidden" role="presentation"></div>
<div id="command" class="command-layer hidden" role="presentation"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="mobile-backdrop" class="mobile-backdrop hidden"></div>
<script type="module" src="./local-api.js?v=b22a42e620"></script>
<script defer src="./transport.js?v=b22a42e620"></script>
<script type="module" src="./app.js?v=b22a42e620"></script>
<!-- Data is saved only in this browser. No real AI or remote backend on GitHub Pages. -->
</body></html>
