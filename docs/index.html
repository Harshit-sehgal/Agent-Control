<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8"><meta name="color-scheme" content="light dark">
<meta name="description" content="Agent Control: chat with your bots. They draft, you approve and post.">
<meta name="agent-backend" content="static">
<!-- Mirrors the Node server's CSP header so the static Pages build is protected too. Keep the two in sync. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<title>Agent Control</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./app.css?v=b58f2a921d">
</head><body data-pane="list">
<div id="progress" class="progress hidden" role="presentation"></div>
<div id="root" class="app">
  <aside class="pane pane-list" id="sidebar" aria-label="Chats"></aside>
  <main class="pane pane-main" id="main" tabindex="-1"><div class="splash" role="status" aria-live="polite"><p>Opening your chats…</p></div></main>
  <aside class="pane pane-info" id="inspector" aria-label="Chat details"></aside>
</div>
<div id="modal" class="modal-layer hidden" role="presentation"></div>
<div id="command" class="command-layer hidden" role="presentation"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script type="module" src="./local-api.js?v=b58f2a921d"></script>
<script defer src="./transport.js?v=b58f2a921d"></script>
<script type="module" src="./app.js?v=b58f2a921d"></script>
<!-- Data is saved only in this browser. No real AI or remote backend on GitHub Pages. -->
</body></html>
