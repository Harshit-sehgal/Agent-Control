<title>Bot Company Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: quiet sidebar | one centred reading column. Company, Activity, Settings and bot profiles slide over from the right on demand. */
:root{
  --bg:#fbfaf8; --raise:#ffffff; --sunk:#f3f1ed; --line:#ebe7e1; --line2:#ddd8d0;
  --fg:#1c1b19; --soft:#4a4743; --muted:#77726b;
  --mint:#14976c; --mint-soft:#dff4eb; --violet:#6c4cf0; --violet-soft:#efeaff;
  --shadow:0 12px 40px -12px rgba(40,30,10,.22),0 2px 6px -2px rgba(40,30,10,.08);
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1a1d; --raise:#232327; --sunk:#1f1f22; --line:#2e2e33; --line2:#3a3a40;
  --fg:#ecebef; --soft:#c4c2ca; --muted:#9b99a3;
  --mint:#4fd3a4; --mint-soft:#1c3a2f; --violet:#a58cff; --violet-soft:#2b2545;
  --shadow:0 16px 48px -12px rgba(0,0,0,.6),0 2px 8px -2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1a1d; --raise:#232327; --sunk:#1f1f22; --line:#2e2e33; --line2:#3a3a40;
  --fg:#ecebef; --soft:#c4c2ca; --muted:#9b99a3;
  --mint:#4fd3a4; --mint-soft:#1c3a2f; --violet:#a58cff; --violet-soft:#2b2545;
  --shadow:0 16px 48px -12px rgba(0,0,0,.6),0 2px 8px -2px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
::selection{background:var(--violet-soft);color:var(--fg)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
button,input,select,textarea{font:inherit;color:inherit}
option{background:var(--raise);color:var(--fg)}
code{font-size:.95em;color:var(--fg)}
kbd,small,time{color:var(--muted)}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:var(--body);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding-block:14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;overflow:auto;min-height:0}
.co{display:flex;align-items:center;gap:8px;padding:2px 6px 8px}
.co b{font-family:var(--display);font-weight:650;font-size:16px;letter-spacing:-.01em;flex:1}
.status{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;font-size:12.5px;color:var(--muted);text-align:left}
.status:hover{background:var(--line)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 18%,transparent)}
.status .w{flex:1}
.status .hint{opacity:0;transition:opacity .2s}
.status:hover .hint,.status:focus-visible .hint{opacity:1}
.status.paused{color:var(--violet)}
.status.paused .dot{background:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 20%,transparent)}
.status.paused .hint{opacity:1}
.row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:8px;text-align:left;color:var(--soft);min-height:32px}
.row:hover{background:var(--line);color:var(--fg)}
.row.on{background:var(--raise);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px var(--line)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{margin-left:auto}
.new{color:var(--fg);font-weight:500}
.label{font-size:11.5px;color:var(--muted);font-weight:500;padding:14px 8px 4px}
.badge{background:var(--violet);color:#fff;border-radius:99px;font-size:11px;font-weight:600;padding:0 6px;line-height:18px}
.state{width:7px;height:7px;border-radius:50%;flex:none}
.state.working{background:var(--mint);animation:pulse 1.4s var(--ease) infinite}
.state.waiting{background:var(--violet)}
@keyframes pulse{50%{opacity:.35}}
.foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;position:relative}
.top{display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));min-height:56px}
.top .menu{display:none}
.top h1{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .live{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.banner{margin:0 22px 6px;padding:8px 12px;border-radius:10px;background:var(--violet-soft);color:var(--fg);font-size:13px;display:flex;align-items:center;gap:10px}
.banner button{margin-left:auto;color:var(--violet);font-weight:600}
.scroll{flex:1;overflow:auto;min-height:0}
.col{max-width:720px;margin:0 auto;padding:8px 22px 28px;display:flex;flex-direction:column;gap:18px}

.me{align-self:flex-end;max-width:78%;background:var(--mint-soft);border-radius:16px 16px 4px 16px;padding:9px 13px}
.route{font-size:12.5px;color:var(--muted);margin-top:-10px;align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.route b{color:var(--soft);font-weight:500}
.link{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.link:hover{color:var(--fg);text-decoration-color:currentColor}
.why{font-size:12.5px;color:var(--muted);align-self:flex-end;max-width:520px;text-align:right;margin-top:-12px}
.bot{display:flex;gap:12px;align-items:flex-start}
.bot .body{flex:1;min-width:0}
.bot .name{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:baseline}
.bot .name span{font-weight:400;color:var(--muted);font-size:12.5px}
.bot p{margin:2px 0 0;color:var(--fg);max-width:62ch}
.meta{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.working{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
.hop{margin-left:40px;font-size:12.5px;color:var(--muted)}
.hop summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hop summary::-webkit-details-marker{display:none}
.hop summary b{color:var(--soft);font-weight:500}
.hop summary:hover b{color:var(--fg)}
.hop .said{margin:6px 0 0 22px;padding:8px 12px;border-radius:10px;background:var(--sunk);color:var(--fg);font-size:13px;max-width:56ch}
.ask{margin-left:40px;border-radius:14px;background:var(--raise);box-shadow:var(--shadow);padding:14px;max-width:520px}
.ask p{margin:0 0 12px}
.ask .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:9px;padding:6px 12px;font-size:13px;font-weight:500;border:1px solid var(--line2);background:var(--raise)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.settled{margin-left:40px;font-size:12.5px;color:var(--muted)}
.mem{margin-left:40px;font-size:12.5px;color:var(--mint);display:flex;gap:8px;align-items:center}
.picker{margin:6px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:99px;padding:5px 11px;font-size:13px;background:var(--raise);color:var(--soft)}
.chip:hover{border-color:var(--violet);color:var(--fg)}

/* composer */
.composer{padding-block:6px 14px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.box{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--raise);border:1px solid var(--line2);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.box:focus-within{border-color:var(--violet)}
.box input{flex:1;min-width:0;border:0;background:none;outline:none;padding:7px 0;caret-color:var(--violet)}
.box input::placeholder{color:var(--muted)}
.send{width:34px;height:34px;border-radius:10px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.send:disabled{opacity:.35;cursor:default}
.under{max-width:720px;margin:6px auto 0;font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

/* home */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 22px 12vh;gap:18px;overflow:auto;min-height:0}
.home h2{font-family:var(--display);font-weight:600;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.025em;margin:0;text-align:center;text-wrap:balance}
.home .lede{color:var(--muted);margin:-8px 0 4px;text-align:center;max-width:52ch}
.home .box{width:100%;padding:12px 10px 12px 16px;box-shadow:var(--shadow)}
.home .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px}
.faces{display:flex;gap:6px;justify-content:center}

/* slide-over */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 14%,transparent);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:30}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--raise);box-shadow:var(--shadow);z-index:31;transform:translateX(104%);transition:transform .38s var(--ease);display:flex;flex-direction:column}
.open .scrim{opacity:1;pointer-events:auto}
.open .panel{transform:none}
.ph{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 10px 18px}
.ph h3{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0;flex:1}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--sunk);color:var(--fg)}
.pb{flex:1;overflow:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 24px 18px;display:flex;flex-direction:column;gap:20px}
.sub{color:var(--muted);font-size:12.5px;margin:0}
.group h4{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;min-height:40px}
.line:first-of-type{border-top:0}
.line .w{flex:1;min-width:0}
.line .w small{display:block;color:var(--muted);font-size:12px}
.ok{color:var(--mint);font-size:12.5px}
.todo{color:var(--violet);font-size:12.5px}
select.sel{border:1px solid var(--line2);border-radius:8px;background:var(--raise);padding:4px 8px;font-size:12.5px;max-width:170px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 18px}
.tabs button{padding:8px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.who{display:flex;gap:12px;align-items:center}
.who b{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.01em;display:block}
.memo{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.memo:first-child{border-top:0}
.memo .w{flex:1}
.memo.fresh .w{color:var(--mint)}
.memo button{color:var(--muted);font-size:12px;opacity:.0}
.memo:hover button,.memo button:focus-visible{opacity:1}
.addmem{display:flex;gap:8px;margin-top:8px}
.addmem input,.hire input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:9px;background:var(--bg);padding:7px 10px;font-size:13px}
.day{font-size:12px;color:var(--muted);font-weight:600;padding:10px 0 2px}
.act{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:7px 0;font-size:13px;border-top:1px solid var(--line)}
.act:hover .w{color:var(--fg)}
.act .w{flex:1;min-width:0;color:var(--soft)}
.act .w b{color:var(--fg);font-weight:500}
.act time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.undo{color:var(--violet);font-weight:500;margin-left:4px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{padding:4px 10px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0 0 0 13px;padding-left:14px;border-left:1px solid var(--line)}
.node{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:6px;border-radius:9px}
.node:hover{background:var(--sunk)}
.node .w{flex:1;min-width:0}
.node .w b{font-weight:500;display:block;font-size:13.5px}
.node .w small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .st{font-size:11.5px;color:var(--muted)}
.node .st.working{color:var(--mint)}
.hire{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--sunk)}
.hire .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* palette */
.pal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;padding:14vh 16px 16px;background:color-mix(in srgb,var(--fg) 14%,transparent)}
.pal.show{display:flex}
.pal .card{width:min(560px,100%);background:var(--raise);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;font-size:15px;outline:none;caret-color:var(--violet)}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.pal li button.hl,.pal li button:hover{background:var(--sunk)}
.pal li small{margin-left:auto;color:var(--muted);font-size:12px}

/* faces */
.face{--t:#ddd;width:28px;height:28px;flex:none;border-radius:9px;background:color-mix(in srgb,var(--t) 72%,var(--raise));position:relative;display:inline-block}
.face.s{width:20px;height:20px;border-radius:6px}
.face.l{width:48px;height:48px;border-radius:14px}
.face.m{border-radius:50%}
.face i{position:absolute;top:40%;width:13%;height:22%;background:var(--fg);border-radius:3px;animation:blink 4.8s infinite;animation-delay:var(--d,0s)}
.face i:first-child{left:28%}.face i:last-child{right:28%}
.face.read i{animation:read 1.1s ease-in-out infinite alternate}
.face.sleep i{height:5%;top:54%;animation:none;opacity:.65}
.face.you{--t:var(--mint)}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
@keyframes read{from{translate:-2px 0}to{translate:2px 0}}
.fadein{animation:fade .45s var(--ease) both}
@keyframes fade{from{opacity:.001;translate:0 6px}}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86%);z-index:32;transform:translateX(-104%);transition:transform .38s var(--ease);padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
  .navopen .side{transform:none}
  .navopen .scrim{opacity:1;pointer-events:auto}
  .top{padding-left:max(14px,env(safe-area-inset-left,0px))}
  .top .menu{display:grid}
  .col,.composer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hop,.ask,.settled,.mem{margin-left:0}
  .me{max-width:88%}
  .under .k{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="co"><b>Your company</b></div>
    <button class="status" id="pause" aria-label="Pause all bots"><span class="dot"></span><span class="w" id="statusText">Atlas on watch · others asleep</span><span class="hint" id="statusHint">Pause all</span></button>
    <button class="row new" data-go="home"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">New thread</span></button>
    <button class="row" data-go="palette"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span class="t">Jump to…</span><kbd class="k">⌘K</kbd></button>
    <button class="row" data-panel="activity"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="t">Activity</span></button>
    <button class="row" data-panel="company"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2h12v2"/></svg><span class="t">Company</span></button>
    <div id="needs"></div>
    <div class="label">Threads</div>
    <div id="threads"></div>
    <div class="foot"><button class="row" data-panel="settings"><span class="face s you"><i></i><i></i></span><span class="t">You</span><svg class="i" viewBox="0 0 24 24" aria-label="Settings"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2 1.2M17.8 15.3l2 1.2M4.2 16.5l2-1.2M17.8 8.7l2-1.2"/></svg></button></div>
  </aside>
  <main class="main" id="main"></main>
  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Details" aria-hidden="true"></aside>
</div>
<div class="pal" id="pal" role="dialog" aria-label="Jump to"><div class="card"><input id="palIn" placeholder="Jump to a thread, a bot or a page" autocomplete="off" aria-label="Search"><ul id="palList"></ul></div></div>

<script>
const ICON={send:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',menu:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>'};
const BOTS=[
 {id:'atlas',name:'Atlas',role:'Primary',boss:null,tint:'#b9a6f5',job:'Runs the company. Routes new threads, settles who owns what, creates bots.',kw:[],mem:['You like short answers first, detail after']},
 {id:'ops',name:'Ops lead',role:'Manager',boss:'atlas',tint:'#9fd8c4',job:'Manages inbox and calendar work.',kw:[],mem:['Mailroom flags clients; Planner owns your week']},
 {id:'mail',name:'Mailroom',role:'Bot',boss:'ops',tint:'#f5c59f',job:'Reads and triages your Gmail.',kw:['inbox','email','mail','gmail','client','reply'],mem:['Clients: anyone from @northwind.example','You archive newsletters unread']},
 {id:'plan',name:'Planner',role:'Bot',boss:'ops',tint:'#a9c8f5',job:'Plans your week, meetings and reminders.',kw:['week','meeting','calendar','schedule','plan','tomorrow','remind'],mem:['No meetings before 10:00','Gym on Tuesday and Thursday evenings']},
 {id:'rl',name:'Research lead',role:'Manager',boss:'atlas',tint:'#f2b8cf',job:'Manages research and writing.',kw:[],mem:['Scholar finds, Quill writes']},
 {id:'sch',name:'Scholar',role:'Bot',boss:'rl',tint:'#c8e39b',job:'Finds and reads sources: papers, docs, the web.',kw:['paper','papers','research','source','find','learn','compare','study'],mem:['You trust arXiv and official docs over blogs']},
 {id:'quill',name:'Quill',role:'Bot',boss:'rl',tint:'#f1df8f',job:'Writes drafts, summaries and posts.',kw:['write','draft','summary','summarize','summarise','post','blog'],mem:['Your voice: plain, no emoji, short sentences']},

];
const by=id=>BOTS.find(b=>b.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=b=>b.job.split(/[.:]/)[0];
const chain=id=>{const o=[];let b=by(id);while(b){o.unshift(b);b=b.boss&&by(b.boss)}return o};
const S={threads:[],cur:null,panel:null,tab:'overview',busy:new Set(),paused:false,filter:'outside',actAll:null,palIdx:0,hire:false,

const faceState=b=>S.busy.has(b.id)?'read':(b.id==='atlas'?'':'sleep');
const face=(b,size='',st='')=>`<span class="face ${size} ${b.role!=='Bot'?'m':''} ${st}" style="--t:${b.tint};--d:${(b.name.length%5)*.8}s" aria-hidden="true"><i></i><i></i></span>`;

const pending=()=>S.threads.flatMap(t=>t.items.filter(i=>i.k==='ask'&&!i.done).map(i=>({...i,thread:t.id})));

const H=36e5,now=Date.now();
S.activity=[
 {at:now-26*H,bot:'atlas',kind:'bots',text:'created Ledger, with no manager'},

];
const log=(bot,kind,text,thread,undo)=>{S.activity.push({at:Date.now(),bot,kind,text,thread,undo});if(S.panel)renderPanel()};

const SCRIPTS=[
 {match:t=>/paper|research/i.test(t)&&/summar|write|draft|post/i.test(t),owner:'sch',helpers:['quill'],
  ask:{action:'use the shared browser on arxiv.org',scope:'Browser: arxiv.org'},
  side:[['sch','quill','I have three papers and notes on each. Can you turn them into a five-line summary in the owner\'s voice?'],['quill','sch','Done. Plain, no emoji, one line per paper plus a pick. Sending it back.']],
  reply:'Three recent papers, summarised by Quill. The second is the one to read first: it ships code and a benchmark you can rerun.',
  learn:['sch','You want papers with code first'],out:['sch','opened 3 pages on arxiv.org']},
 {match:t=>/week|plan|meeting|calendar/i.test(t)&&/mail|inbox|email|client/i.test(t),owner:'plan',helpers:['mail'],
  ask:{action:'read your Gmail',scope:'Gmail: read'},
  side:[['plan','mail','Any client emails this week that need a meeting?'],['mail','plan','Two. Northwind wants a call on Wednesday. An invoice question can wait for email.']],
  reply:'Your week is planned. The Northwind call is on Wednesday at 11:00, after your no-meetings-before-10 rule. Tuesday and Thursday evenings stay free for the gym, and the invoice question is in Mailroom\'s list.',
  learn:['plan','Client calls go late in the morning'],out:['plan','added "Northwind call" to Google Calendar, Wednesday 11:00',true]},
];
function routeFor(t){
  const s=SCRIPTS.find(x=>x.match(t));if(s)return s;
  let best=null,sc=0;BOTS.filter(b=>b.role==='Bot').forEach(b=>{const n=b.kw.filter(k=>t.toLowerCase().includes(k)).length;if(n>sc){sc=n;best=b}});
  if(!best)return{owner:'atlas',helpers:[],create:true,reply:'No one here owns this yet. I can handle it once, or hire a bot whose job it is.'};
  return{owner:best.id,helpers:[],reply:`This is my job, so I took it. Here is what I found.`,learn:[best.id,'You asked: '+t.slice(0,44)]};
}

function composer(home){

}
function itemHTML(it,t){
  const b=it.bot&&by(it.bot);
  switch(it.k){
    case 'me':return `<div class="me fadein">${esc(it.text)}</div>`;
    case 'route':return `<div class="route fadein"><span>${esc(by(it.owner).name)} took this</span><span>·</span><span>via ${chain(it.owner).slice(0,-1).map(x=>esc(x.name)).join(' → ')||'Atlas'}</span><span>·</span><button class="link" data-why="${t.id}">${it.quiet.length} stayed asleep</button></div>${t.why?`<div class="why">${it.quiet.map(id=>`${by(id).name}: ${short(by(id)).toLowerCase()}`).join(' · ')}</div>`:''}`;
    case 'work':return `<div class="working">${face(b,'','read')}<span>${b.name} is working${it.note?' · '+esc(it.note):''}</span></div>`;
    case 'hop':{const f=by(it.from),to=by(it.to);return `<details class="hop fadein"><summary>${face(f,'s')}<span><b>${f.name}</b> messaged <b>${to.name}</b></span></summary><div class="said">${esc(it.text)}</div></details>`}
    case 'ask':return it.done?`<div class="settled">${esc(it.done)}</div>`:`<div class="ask fadein"><p><b>${b.name}</b> wants to ${esc(it.action)}.</p><div class="acts"><button class="btn primary" data-ans="always" data-ask="${it.id}">Always allow</button><button class="btn" data-ans="once" data-ask="${it.id}">Allow once</button><button class="btn" data-ans="no" data-ask="${it.id}">Decline</button></div></div>`;
    case 'reply':return `<div class="bot fadein">${face(b)}<div class="body"><div class="name">${b.name}<span>${short(b)}</span></div><p>${esc(it.text)}</p>${it.create?`<div class="picker"><button class="chip" data-hire-from="${t.id}">Hire a bot for bookings</button><button class="chip">Handle it once</button></div>`:''}<div class="meta">${it.ctx?`<span title="Picked automatically">Used ${esc(it.ctx)}</span>`:''}${it.bot!=='atlas'?`<button class="link" data-wrong="${t.id}">Wrong bot?</button>`:''}</div>${t.wrong?`<div class="picker">${BOTS.filter(x=>x.role==='Bot'&&x.id!==it.bot).map(x=>`<button class="chip" data-hand="${x.id}" data-t="${t.id}">${x.name}</button>`).join('')}</div>`:''}</div></div>`;

    case 'note':return `<div class="settled">${esc(it.text)}</div>`;
  }
}

function dayName(ts){const d=new Date(ts),n=new Date();const diff=Math.round((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);return diff===0?'Today':diff===1?'Yesterday':d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}
function acts(list,showName=true){
  if(!list.length)return '<p class="sub">Nothing here yet.</p>';
  let h='',last='';[...list].sort((a,b)=>b.at-a.at).forEach(a=>{const d=dayName(a.at);if(d!==last){h+=`<div class="day">${d}</div>`;last=d}
    const b=by(a.bot);h+=`<button class="act" ${a.thread?`data-open="${a.thread}"`:''}>${face(b,'s')}<span class="w">${showName?`<b>${b.name}</b> `:''}${esc(showName?a.text:a.text[0].toUpperCase()+a.text.slice(1))}${a.undo&&Date.now()-a.at<30000?'<span class="undo">Undo</span>':''}</span><time>${new Date(a.at).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</time></button>`});
  return h;
}

/* ---------- the run ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const up=t=>{if(S.cur===t.id)renderMain();renderSide();if(S.panel)renderPanel()};
async function send(text){
  if(S.paused)return;
  const t={id:'t'+Date.now(),title:text.length>44?text.slice(0,42)+'…':text,owner:null,items:[],running:true};
  S.threads.unshift(t);S.cur=t.id;t.items.push({k:'me',text});render();
  await wait(550);
  const r=routeFor(text),owner=by(r.owner);t.owner=owner.id;
  const quiet=BOTS.filter(b=>b.role==='Bot'&&b.id!==owner.id&&!r.helpers.includes(b.id)).map(b=>b.id);
  t.items.push({k:'route',owner:owner.id,quiet});S.busy.add(owner.id);
  const work={k:'work',bot:owner.id};t.items.push(work);up(t);
  await wait(800);
  if(r.ask){
    const g=(S.grants[owner.id]||{})[r.ask.scope];
    if(g==='deny'){t.items.splice(t.items.indexOf(work),1);S.busy.delete(owner.id);t.running=false;t.items.push({k:'reply',bot:owner.id,text:`"${r.ask.scope}" is set to Deny for me, so I stopped here. You can change it on my profile.`});up(t);return}
    if(g!=='always'){
      const ask={k:'ask',id:'a'+Date.now(),bot:owner.id,action:r.ask.action,short:r.ask.action.split(' ').slice(0,4).join(' ')};
      t.items.splice(t.items.indexOf(work),1,ask);S.busy.delete(owner.id);up(t);
      const ans=await new Promise(res=>asks[ask.id]=res);
      ask.done={always:`You allowed ${owner.name} to ${r.ask.action}, always.`,once:'You allowed it once.',no:'You declined.'}[ans];
      if(ans==='always'){(S.grants[owner.id]=S.grants[owner.id]||{})[r.ask.scope]='always'}
      log(owner.id,'perm',{always:`was set to Always allow for "${r.ask.scope}"`,once:`was allowed "${r.ask.scope}" once`,no:`was declined "${r.ask.scope}"`}[ans],t.id);
      if(ans==='no'){t.running=false;t.items.push({k:'reply',bot:owner.id,text:'Okay. I can answer from what I already know, or you can allow it later from my profile.'});up(t);return}
      t.items.push(work);S.busy.add(owner.id);up(t);await wait(500);
    }
  }
  if(r.side){
    r.helpers.forEach(h=>S.busy.add(h));
    for(const [f,to,m] of r.side){work.note=`${by(f).name} → ${by(to).name}`;t.items.splice(t.items.indexOf(work),0,{k:'hop',from:f,to,text:m});up(t);await wait(750)}
    r.helpers.forEach(h=>S.busy.delete(h));
  }
  t.items.splice(t.items.indexOf(work),1);S.busy.delete(owner.id);t.running=false;
  const ctx=`${owner.mem.length} ${owner.mem.length===1?'memory':'memories'}${r.helpers.length?' and '+r.helpers.map(h=>by(h).name).join(', ')+"'s reply":''}`;
  t.items.push({k:'reply',bot:owner.id,text:r.reply,ctx:r.create?null:ctx,create:r.create});
  if(r.out)log(r.out[0],'outside',r.out[1],t.id,r.out[2]);
  if(r.learn){const b=by(r.learn[0]);b.mem.push(r.learn[1]);b.fresh=b.mem.length-1;t.items.push({k:'mem',bot:b.id,text:r.learn[1]})}
  up(t);
}

/* ---------- palette ---------- */
function palItems(q){
  const all=[...S.threads.map(t=>({label:t.title,hint:'Thread',go:()=>{S.cur=t.id;render()}})),
    ...BOTS.map(b=>({label:b.name,hint:b.role==='Bot'?short(b):b.role,face:b,go:()=>{S.panel=b.id;S.tab='overview';render()}})),
    {label:'New thread',hint:'Page',go:()=>{S.cur=null;render()}},{label:'Activity',hint:'Page',go:()=>{S.panel='activity';render()}},
    {label:'Company',hint:'Page',go:()=>{S.panel='company';render()}},{label:'Settings',hint:'Page',go:()=>{S.panel='settings';render()}}];
  q=q.toLowerCase().trim();return q?all.filter(i=>(i.label+' '+i.hint).toLowerCase().includes(q)):all;
}
function renderPal(){const it=palItems($('palIn').value);S.palIdx=Math.min(S.palIdx,Math.max(it.length-1,0));
  $('palList').innerHTML=it.map((i,n)=>`<li><button class="${n===S.palIdx?'hl':''}" data-pal="${n}">${i.face?face(i.face,'s'):''}<span>${esc(i.label)}</span><small>${esc(i.hint)}</small></button></li>`).join('')||'<li class="sub" style="padding:10px">No matches.</li>'}
function openPal(){$('pal').classList.add('show');$('palIn').value='';S.palIdx=0;renderPal();$('palIn').focus()}
function closePal(){$('pal').classList.remove('show')}
$('palIn').addEventListener('input',()=>{S.palIdx=0;renderPal()});
$('palIn').addEventListener('keydown',e=>{const it=palItems($('palIn').value);
  if(e.key==='ArrowDown'){S.palIdx=Math.min(S.palIdx+1,it.length-1);renderPal();e.preventDefault()}
  else if(e.key==='ArrowUp'){S.palIdx=Math.max(S.palIdx-1,0);renderPal();e.preventDefault()}
  else if(e.key==='Enter'&&it[S.palIdx]){closePal();it[S.palIdx].go()}});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='pal'){closePal();return}
  if(e.target.id==='scrim'){S.panel=null;$('app').classList.remove('navopen');render();return}
  const el=e.target.closest('button');if(!el)return;const d=el.dataset,app=$('app');
  if(d.pal!==undefined){const it=palItems($('palIn').value)[+d.pal];closePal();it&&it.go();return}
  if(d.go==='home'){S.cur=null;app.classList.remove('navopen');render()}
  else if(d.go==='palette'){app.classList.remove('navopen');openPal()}
  else if(d.panel){S.panel=d.panel;if(by(d.panel))S.tab='overview';app.classList.remove('navopen');render()}
  else if(d.bot){S.panel=d.bot;S.tab='overview';render()}
  else if(d.close!==undefined){S.panel=null;render()}
  else if(d.nav!==undefined){app.classList.add('navopen')}
  else if(d.open){S.cur=d.open;S.panel=null;app.classList.remove('navopen');render()}
  else if(d.try){send(d.try)}
  else if(d.ans){asks[d.ask]?.(d.ans)}
  else if(d.why){const t=S.threads.find(x=>x.id===d.why);t.why=!t.why;renderMain()}
  else if(d.wrong){const t=S.threads.find(x=>x.id===d.wrong);t.wrong=!t.wrong;renderMain()}
  else if(d.hand){const t=S.threads.find(x=>x.id===d.t),nb=by(d.hand);t.wrong=false;t.owner=nb.id;t.items.push({k:'note',text:`You handed this to ${nb.name}. Atlas will route threads like this to ${nb.name} from now on.`});by('atlas').mem.push(`Threads like "${t.title}" go to ${nb.name}`);t.items.push({k:'reply',bot:nb.id,text:'Got it, this one is mine. Picking up from here.'});render()}
  else if(d.tab){S.tab=d.tab;renderPanel()}
  else if(d.filter){S.filter=d.filter;renderPanel()}
  else if(d.actall){S.actAll=S.actAll===d.actall?null:d.actall;renderPanel()}
  else if(d.forget!==undefined){const b=by(d.b);b.mem.splice(+d.forget,1);b.fresh=null;renderPanel()}
  else if(d.dm){S.panel=null;S.cur=null;render();const i=$('main').querySelector('input');i.value='@'+by(d.dm).name+' ';i.focus()}
  else if(d.hireOpen!==undefined){S.hire=true;renderPanel();$('panel').querySelector('[name=what]').focus()}
  else if(d.hireCancel!==undefined){S.hire=false;renderPanel()}
  else if(d.hireFrom){const t=S.threads.find(x=>x.id===d.hireFrom);const nb={id:'b'+Date.now(),name:'Concierge',role:'Bot',boss:'ops',tint:'#e7b3f0',job:'Books tables, tickets and travel.',kw:['book','table','ticket','travel'],mem:['Hired by Atlas from your thread']};BOTS.push(nb);t.owner=nb.id;
    t.items.push({k:'note',text:'Atlas hired Concierge, reporting to Ops lead.'});t.items.push({k:'reply',bot:nb.id,text:'Hi, bookings are mine now. Which restaurant, and what time on Friday?'});log('atlas','bots','hired Concierge under Ops lead',t.id);render()}
  else if(d.resume!==undefined||el.id==='pause'){S.paused=d.resume!==undefined?false:!S.paused;log('atlas','bots',S.paused?'was told to pause all bots':'was told to resume all bots');render()}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.dataset.form!==undefined){const v=f.q.value.trim();if(v){f.q.value='';send(v)}}
  else if(f.dataset.hire!==undefined){const what=f.what.value.trim();if(!what)return;const names=['Scout','Pilot','Keeper','Tally','Echo'];const nb={id:'b'+Date.now(),name:names[BOTS.length%names.length],role:'Bot',boss:f.boss.value||null,tint:'#9ee0e6',job:what.replace(/^./,c=>c.toUpperCase()).replace(/\.?$/,'.'),kw:what.toLowerCase().split(/\W+/).filter(w=>w.length>3),mem:['Hired by you from the company chart']};BOTS.push(nb);S.hire=false;log('atlas','bots',`hired ${nb.name}${nb.boss?' under '+by(nb.boss).name:', with no manager'}`);S.panel=nb.id;S.tab='overview';render()}
  else if(f.dataset.addmem){const b=by(f.dataset.addmem),v=f.m.value.trim();if(v){b.mem.push(v);b.fresh=b.mem.length-1;renderPanel()}}
});
document.addEventListener('change',e=>{const s=e.target;
  if(s.dataset.perm){S.grants[s.dataset.perm][s.dataset.scope]=s.value;log(s.dataset.perm,'perm',`was set to ${s.selectedOptions[0].text} for "${s.dataset.scope}"`);renderPanel()}
  else if(s.dataset.boss){const b=by(s.dataset.boss);b.boss=s.value||null;log('atlas','bots',`moved ${b.name} ${b.boss?'under '+by(b.boss).name:'to no manager'}`);renderPanel()}
  else if(s.dataset.themeSel!==undefined){s.value?document.documentElement.setAttribute('data-theme',s.value):document.documentElement.removeAttribute('data-theme')}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('pal').classList.contains('show')?closePal():openPal()}
  else if(e.key==='Escape'){if($('pal').classList.contains('show'))closePal();else if(S.panel){S.panel=null;render()}else $('app').classList.remove('navopen')}
});

/* one finished example thread */
S.threads.push({id:'seed',title:'Reply to the Northwind email',owner:'mail',items:[
  {k:'me',text:'Reply to the Northwind email and say we can do Wednesday'},
  {k:'route',owner:'mail',quiet:['plan','sch','quill','ledger']},
  {k:'hop',from:'mail',to:'plan',text:'Northwind confirmed Wednesday. Can you hold 11:00?'},
  {k:'reply',bot:'mail',text:'Sent: "Wednesday works. 11:00?" Planner is holding the slot.',ctx:'2 memories'}]});
render();
</script>
