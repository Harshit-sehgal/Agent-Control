<title>Bot Company Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the bots are the home. Floating controls: + new bot (top right), settings and New thread (bottom left).
   A drawer slides in from the left (usage, threads, places); details slide in from the right. Three looks to compare. */
:root{
  --bg:#fbfaf8; --raise:#ffffff; --sunk:#f3f1ed; --line:#ebe7e1; --line2:#ddd8d0;
  --fg:#1c1b19; --soft:#4a4743; --muted:#736e67;
  --mint:#13916a; --mint-soft:#dff4eb; --violet:#6c4cf0; --violet-soft:#efeaff;
  --shadow:0 14px 40px -14px rgba(40,30,10,.25),0 2px 6px -2px rgba(40,30,10,.08);
  --float:0 10px 28px -8px rgba(40,30,10,.28),0 2px 6px rgba(40,30,10,.08);
  --r:18px; --r-s:11px;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --faceShine:1; --faceGlow:0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1a1d; --raise:#232327; --sunk:#1f1f22; --line:#2e2e33; --line2:#3a3a40;
  --fg:#ecebef; --soft:#c6c4cc; --muted:#9e9ca6;
  --mint:#4fd3a4; --mint-soft:#1c3a2f; --violet:#a58cff; --violet-soft:#2b2545;
  --shadow:0 16px 48px -12px rgba(0,0,0,.65),0 2px 8px -2px rgba(0,0,0,.4); --float:0 10px 30px -8px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1a1d; --raise:#232327; --sunk:#1f1f22; --line:#2e2e33; --line2:#3a3a40;
  --fg:#ecebef; --soft:#c6c4cc; --muted:#9e9ca6;
  --mint:#4fd3a4; --mint-soft:#1c3a2f; --violet:#a58cff; --violet-soft:#2b2545;
  --shadow:0 16px 48px -12px rgba(0,0,0,.65),0 2px 8px -2px rgba(0,0,0,.4); --float:0 10px 30px -8px rgba(0,0,0,.7); color-scheme:dark}
/* Ink and paper: warmer paper, crisp ink, editorial serif, flat faces, tighter corners */
.app[data-look="ink"]{--bg:#f6f3ec;--raise:#fffdf7;--sunk:#eeeae1;--line:#e0dace;--line2:#cfc8b9;--fg:#16140f;--soft:#3f3b33;--muted:#6f685c;--mint:#0f7653;--mint-soft:#e2eee5;--violet:#4f30d4;--violet-soft:#ebe6fa;--r:8px;--r-s:6px;--display:"Fraunces",Georgia,serif;--faceShine:0;--shadow:0 1px 0 var(--line2),0 12px 30px -18px rgba(30,20,0,.35);--float:0 1px 0 var(--line2),0 8px 20px -10px rgba(30,20,0,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app[data-look="ink"]{--bg:#191815;--raise:#211f1b;--sunk:#1c1b18;--line:#2f2c26;--line2:#3d3a32;--fg:#efebe2;--soft:#cdc7ba;--muted:#a19a8c;--mint:#5cc99c;--mint-soft:#1d332a;--violet:#a892ff;--violet-soft:#29243d;--shadow:0 1px 0 var(--line2),0 14px 34px -14px rgba(0,0,0,.7);--float:0 10px 26px -8px rgba(0,0,0,.7)}}
:root[data-theme="dark"] .app[data-look="ink"]{--bg:#191815;--raise:#211f1b;--sunk:#1c1b18;--line:#2f2c26;--line2:#3d3a32;--fg:#efebe2;--soft:#cdc7ba;--muted:#a19a8c;--mint:#5cc99c;--mint-soft:#1d332a;--violet:#a892ff;--violet-soft:#29243d;--shadow:0 1px 0 var(--line2),0 14px 34px -14px rgba(0,0,0,.7);--float:0 10px 26px -8px rgba(0,0,0,.7)}
/* Night desk: dark first, tints glow */
.app[data-look="night"]{--bg:#121216;--raise:#1b1b21;--sunk:#16161b;--line:#26262e;--line2:#33333d;--fg:#f1f0f5;--soft:#c9c7d2;--muted:#9a98a6;--mint:#5be0b0;--mint-soft:#163328;--violet:#b29bff;--violet-soft:#272042;--shadow:0 18px 50px -14px rgba(0,0,0,.8);--float:0 12px 34px -8px rgba(0,0,0,.85);--faceGlow:1;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
option{background:var(--raise);color:var(--fg)}
code{font-size:.92em}
::selection{background:var(--violet-soft);color:var(--fg)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:var(--body);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px}

.app{height:100%;background:var(--bg);color:var(--fg);position:relative;overflow:hidden;transition:background .4s var(--ease)}
.view{height:100%;overflow:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) 140px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:30px}

/* faces: characters with role shapes */
.face{--t:#ccc;--s:28px;width:var(--s);height:var(--s);flex:none;position:relative;display:inline-block;border-radius:30%;
  background:radial-gradient(130% 120% at 28% 22%,color-mix(in srgb,var(--t) calc(40% + 30% * (1 - var(--faceShine))),#fff) 0%,color-mix(in srgb,var(--t) 88%,var(--raise)) 58%,color-mix(in srgb,var(--t) 70%,#000) 140%);
  box-shadow:0 0 calc(var(--s) * .55 * var(--faceGlow)) calc(var(--s) * -.08 * var(--faceGlow)) color-mix(in srgb,var(--t) 70%,transparent);transition:transform .35s var(--ease),filter .35s var(--ease)}
.app[data-look="ink"] .face{background:color-mix(in srgb,var(--t) 78%,var(--raise))}
.face.primary{border-radius:50%}
.face.mgr{border-radius:0;clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%)}
.face .eyes{position:absolute;inset:0;translate:calc(var(--lx,0) * var(--s) * .05) calc(var(--ly,0) * var(--s) * .04);transition:translate .25s var(--ease)}
.face i{position:absolute;top:38%;width:12%;height:21%;background:#1b1a18;border-radius:99px;animation:blink 5s infinite;animation-delay:var(--d,0s)}
.face i:first-child{left:29%}.face i:last-child{right:29%}
.face b{position:absolute;left:41%;width:18%;bottom:24%;height:6%;border-radius:99px;background:#1b1a18;opacity:.5;transition:all .3s var(--ease)}
.face.read i{animation:read 1.1s ease-in-out infinite alternate}
.face.read b{height:9%;width:12%;left:44%;border-radius:50%}
.face.sleep i{height:5%;top:50%;animation:none;opacity:.6}
.face.sleep b{opacity:0}
.face.wake{transform:translateY(-6px) scale(1.08)}
.face.wake b{height:10%;width:20%;left:40%;border-radius:0 0 99px 99px;opacity:.7}
.face.wait{animation:bob 2.4s ease-in-out infinite}
.face.wait .eyes{translate:calc(var(--s) * .07) calc(var(--s) * .07)}
.face.wait b{width:11%;left:44.5%;height:11%;border-radius:50%;opacity:.6}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--violet);animation:dot 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-5deg)}60%{transform:translateY(-1px) rotate(4deg)}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.face.s{--s:20px}.face.m{--s:44px}.face.l{--s:64px}.face.xl{--s:88px}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
@keyframes read{from{translate:-2px 0}to{translate:2px 0}}

/* floating controls */
.fab{position:fixed;z-index:20;display:flex;align-items:center;gap:8px;background:var(--raise);color:var(--fg);box-shadow:var(--float);border-radius:99px;transition:transform .25s var(--ease),bottom .35s var(--ease)}
.fab:hover{transform:translateY(-2px)}
.fab-bot{top:calc(16px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));width:46px;height:46px;justify-content:center}
.fab-bot svg{width:20px;height:20px}
.dock{position:fixed;z-index:20;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;transition:bottom .35s var(--ease)}
.has-composer .dock{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.dock .fab{position:static}
.fab-set{width:46px;height:46px;justify-content:center;position:relative}
.fab-set .badge{position:absolute;top:-3px;right:-3px}
.fab-new{height:46px;padding:0 18px 0 14px;font-weight:600;background:var(--fg);color:var(--bg);right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.has-composer .fab-new{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.looks{position:fixed;z-index:20;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;display:flex;gap:2px;background:var(--raise);box-shadow:var(--float);border-radius:99px;padding:4px;font-size:12.5px}
.has-composer .looks{display:none}
.looks span{padding:6px 8px 6px 12px;color:var(--muted)}
.looks button{padding:6px 12px;border-radius:99px;color:var(--soft)}
.looks button.on{background:var(--fg);color:var(--bg)}

/* bots home */
.hello{display:flex;align-items:flex-end;gap:16px;padding-right:64px;flex-wrap:wrap}
.hello h1{font-family:var(--display);font-weight:650;font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;line-height:1.05;margin:0;text-wrap:balance}
.app[data-look="ink"] .hello h1{font-weight:500;letter-spacing:-.02em}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--sunk);font-size:12.5px;color:var(--soft)}
.status:hover{background:var(--line)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 20%,transparent)}
.status.paused{background:var(--violet-soft);color:var(--violet)}
.status.paused .dot{background:var(--violet)}
.needs{display:flex;flex-direction:column;gap:8px}
.need{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--violet-soft);text-align:left;width:100%}
.need .w{flex:1;min-width:0}
.need .go{color:var(--violet);font-weight:600;font-size:13px}
.atlas{display:flex;gap:20px;align-items:center;padding:22px;border-radius:calc(var(--r) + 6px);background:linear-gradient(120deg,color-mix(in srgb,#b9a6f5 26%,var(--raise)),var(--raise) 70%);box-shadow:var(--shadow);text-align:left;width:100%}
.app[data-look="ink"] .atlas{background:var(--raise)}
.atlas .w{flex:1;min-width:0}
.atlas h2{font-family:var(--display);font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0}
.app[data-look="ink"] .atlas h2{font-weight:500}
.atlas p{margin:2px 0 0;color:var(--soft);max-width:56ch}
.atlas .cta{margin-top:12px;display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--violet)}
.team h3{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.team h3 button{display:inline-flex;gap:8px;align-items:center;border-radius:8px;padding:2px 4px 2px 2px}
.team h3 button:hover{background:var(--sunk)}
.team h3 small{font-weight:400;color:var(--muted)}
.rowscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;margin:0 -2px}
.card{scroll-snap-align:start;flex:0 0 200px;min-height:196px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:var(--r);background:var(--raise);box-shadow:var(--shadow);text-align:left;position:relative;transition:transform .3s var(--ease)}
.card:hover{transform:translateY(-3px)}
.card .face{margin-bottom:8px}
.card b{font-size:15px;font-weight:600}
.card .job{color:var(--muted);font-size:12.5px;line-height:1.4}
.card .last{margin-top:auto;font-size:12px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .info{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.card .info:hover{background:var(--sunk);color:var(--fg)}
.pill{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.working{background:var(--mint-soft);color:var(--mint)}
.pill.waiting{background:var(--violet-soft);color:var(--violet)}
/* bot tree: managers drop down from the primary */
.btree,.btree ul{list-style:none;margin:0;padding:0}
.btree ul{margin-left:22px;padding-left:12px;border-left:1px solid var(--line)}
.brow{display:flex;align-items:center;gap:6px;padding:3px 0}
.tog{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
button.tog:hover{background:var(--sunk);color:var(--fg)}
.tog .chev{width:15px;height:15px;transition:transform .4s var(--ease)}
.open>.brow .tog .chev{transform:rotate(90deg)}
.bmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-s);text-align:left}
.bmain:hover{background:var(--sunk)}
.bmain .w{flex:1;min-width:0}
.bmain b{display:block;font-weight:600;font-size:14.5px}
.bmain small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease) .12s}
.open>.kids{grid-template-rows:1fr;transition-delay:0s}
.kids>ul{overflow:hidden;min-height:0}
.kids>ul>li{opacity:0;transform:translateY(-20px);transition:opacity .18s ease,transform .26s cubic-bezier(.5,0,.75,0)}
.open>.kids>ul>li{opacity:1;transform:none;transition:opacity .3s ease calc(var(--i) * 60ms),transform .6s cubic-bezier(.34,1.5,.64,1) calc(var(--i) * 60ms)}
/* home: a sentence, the team, lately */
.home{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px;padding-top:30px}
.when{font-size:13px;color:var(--muted)}
.roll{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.2;letter-spacing:-.025em;margin:6px 0 0;text-wrap:pretty;max-width:24ch}
.app[data-look="ink"] .roll{font-weight:500}
.nm{font:inherit;color:inherit;letter-spacing:inherit;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.15em;text-decoration-color:color-mix(in srgb,var(--t) 90%,transparent);border-radius:6px}
.nm:hover{text-decoration-color:var(--fg)}
.nm.w{color:var(--violet);text-decoration-color:currentColor}
.roll .quiet{color:var(--muted)}
.lbl{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 8px}
.brow .st{font-size:12.5px;color:var(--mint);white-space:nowrap;margin-left:auto;padding-left:8px}
.brow .st.wait{color:var(--violet)}
.prof{font-size:12.5px;color:var(--muted);padding:6px 8px;border-radius:8px;opacity:0;transition:opacity .2s}
.prof:hover{background:var(--sunk);color:var(--fg)}
.brow:hover .prof,.prof:focus-visible{opacity:1}
@media (hover:none){.prof{opacity:1}}
.btree>li>.brow .bmain b{font-family:var(--display);font-size:20px;letter-spacing:-.015em}
/* drawer */
.ph .you{flex:1}
.switch{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--r);background:var(--sunk);text-align:left;font-weight:500}
.switch .w{flex:1}
.switch .w small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.knob{width:40px;height:24px;flex:none;border-radius:99px;background:var(--mint);position:relative;transition:background .25s}
.knob::after{content:'';position:absolute;top:3px;left:19px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .35s var(--ease)}
.switch[aria-checked="false"] .knob{background:var(--line2)}
.switch[aria-checked="false"] .knob::after{left:3px}
.big{font-family:var(--display);font-size:38px;font-weight:650;letter-spacing:-.03em;line-height:1}
.app[data-look="ink"] .big{font-weight:500}
.big small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:8px}
.stack{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:14px 0 10px}
.stack span{height:100%}
.whoused{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--soft)}
.whoused span{display:inline-flex;gap:6px;align-items:center}
.whoused em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:4px;background:var(--line2);display:inline-block}
.navl .line .w{font-size:14px;color:var(--fg)}
.foot{font-size:12px;color:var(--muted);margin:auto 0 0}
/* faces: cheeks and a catch-light */
.face::before{content:'';position:absolute;left:14%;right:14%;top:58%;height:14%;background:radial-gradient(circle at 10% 50%,rgba(255,110,120,.32) 0 34%,transparent 36%),radial-gradient(circle at 90% 50%,rgba(255,110,120,.32) 0 34%,transparent 36%);pointer-events:none}
.face i::after{content:'';position:absolute;top:16%;left:18%;width:38%;height:26%;border-radius:50%;background:#fff;opacity:.85}
.face.sleep i::after{display:none}
.recent h3{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 6px}
.trow{display:flex;gap:12px;align-items:center;width:100%;padding:10px 4px;border-top:1px solid var(--line);text-align:left}
.trow:first-of-type{border-top:0}
.trow .w{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow small{color:var(--muted)}

/* thread + new */
.tv{display:flex;flex-direction:column;height:100%}
.tv .view{padding-bottom:20px}
.thead{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 10px;padding-right:56px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;border-radius:8px;padding:4px 8px 4px 2px}
.back:hover{color:var(--fg);background:var(--sunk)}
.thead .grow{flex:1;min-width:0}
.thead h1{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app[data-look="ink"] .thead h1{font-weight:500}
.thead .live{font-size:12.5px;color:var(--muted)}
.wash{position:absolute;inset:0 0 auto;height:260px;pointer-events:none;background:linear-gradient(to bottom,color-mix(in srgb,var(--owner,transparent) 16%,transparent),transparent);transition:background .6s var(--ease)}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;position:relative}
.me{align-self:flex-end;max-width:78%;background:var(--mint-soft);border-radius:var(--r) var(--r) 5px var(--r);padding:10px 14px}
.route{font-size:12.5px;color:var(--muted);margin-top:-12px;align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.link{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.link:hover{color:var(--fg);text-decoration-color:currentColor}
.why{font-size:12.5px;color:var(--muted);align-self:flex-end;text-align:right;max-width:520px;margin-top:-14px}
.bot{display:flex;gap:12px;align-items:flex-start}
.bot .body{flex:0 1 auto;min-width:0;max-width:min(78%,560px);background:color-mix(in srgb,var(--t,#ccc) 14%,var(--raise));border-radius:5px var(--r) var(--r) var(--r);padding:9px 14px 10px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.bot .name{font-size:13.5px;font-weight:600;color:var(--tc,var(--fg))}

<script>
const IC={send:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',info:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>',chev:'<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>',arrow:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'};
const BOTS=[
 {id:'atlas',name:'Atlas',role:'Primary',boss:null,tint:'#b9a6f5',job:'Runs the company. Routes new threads, settles who owns what, hires bots.',kw:[],mem:['You like short answers first, detail after']},
 {id:'ops',name:'Ops lead',role:'Manager',boss:'atlas',tint:'#8fd6bd',job:'Manages inbox and calendar work.',kw:[],mem:['Mailroom flags clients; Planner owns your week']},
 {id:'mail',name:'Mailroom',role:'Bot',boss:'ops',tint:'#f5bf93',job:'Reads and triages your Gmail.',kw:['inbox','email','mail','gmail','client','reply'],mem:['Clients: anyone from @northwind.example','You archive newsletters unread']},
 {id:'plan',name:'Planner',role:'Bot',boss:'ops',tint:'#9fc2f5',job:'Plans your week, meetings and reminders.',kw:['week','meeting','calendar','schedule','plan','tomorrow','remind'],mem:['No meetings before 10:00','Gym on Tuesday and Thursday evenings']},
 {id:'rl',name:'Research lead',role:'Manager',boss:'atlas',tint:'#f2b0cb',job:'Manages research and writing.',kw:[],mem:['Scholar finds, Quill writes']},
 {id:'sch',name:'Scholar',role:'Bot',boss:'rl',tint:'#bfe08c',job:'Finds and reads sources: papers, docs, the web.',kw:['paper','papers','research','source','find','learn','compare','study'],mem:['You trust arXiv and official docs over blogs']},
 {id:'quill',name:'Quill',role:'Bot',boss:'rl',tint:'#f0d978',job:'Writes drafts, summaries and posts.',kw:['write','draft','summary','summarize','summarise','post','blog'],mem:['Your voice: plain, no emoji, short sentences']},
 {id:'ledger',name:'Ledger',role:'Bot',boss:null,tint:'#d9bf9c',job:'Tracks spending and receipts.',kw:['spend','spent','receipt','expense','money','budget','invoice','food'],mem:['Monthly budget: 40,000 (example)']},
];
const by=id=>BOTS.find(b=>b.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=b=>b.job.split(/[.:]/)[0];
const isMgr=b=>b.id!=='atlas'&&(b.role==='Manager'||BOTS.some(x=>x.boss===b.id));
const roleOf=b=>b.id==='atlas'?'Primary':isMgr(b)?'Manager':'Bot';
const chain=id=>{const o=[];let b=by(id);while(b){o.unshift(b);b=b.boss&&by(b.boss)}return o};
const S={open:{atlas:true},view:'bots',threads:[],cur:null,left:false,panel:null,tab:'overview',busy:new Set(),paused:false,filter:'outside',actAll:null,palIdx:0,palBots:false,preview:null,recent:['mail','sch','plan'],
  col:(()=>{try{return JSON.parse(localStorage.getItem('drawer-col')||'{}')}catch(e){return{}}})(),
  grants:{mail:{'Gmail: send email':'always','Gmail: read':'always'},plan:{'Google Calendar: edit':'ask'},ledger:{'Pay or spend money':'ask'}},activity:[]};
const faceState=b=>S.busy.has(b.id)?'read':(b.id==='atlas'?'':'sleep');
const face=(b,size='',st)=>`<span class="face ${size} ${b.id==='atlas'?'primary':isMgr(b)?'mgr':''} ${st===undefined?faceState(b):st}" style="--t:${b.tint};--d:${(b.name.length%5)*.9}s" aria-hidden="true"><span class="eyes"><i></i><i></i></span><b></b></span>`;
const asks={};const $=id=>document.getElementById(id);
const pending=()=>S.threads.flatMap(t=>t.items.filter(i=>i.k==='ask'&&!i.done).map(i=>({...i,thread:t.id})));
const stateOf=b=>pending().some(a=>a.bot===b.id)?'waiting':S.busy.has(b.id)?'working':b.id==='atlas'?'awake':'asleep';

const H=36e5,now=Date.now();
S.activity=[
 {at:now-26*H,bot:'atlas',kind:'bots',text:'hired Ledger, with no manager'},
 {at:now-25*H,bot:'mail',kind:'perm',text:'was set to Always allow for "Gmail: send email"'},
 {at:now-3*H,bot:'mail',kind:'outside',text:'sent an email to Northwind: "Wednesday works. 11:00?"',thread:'seed'},
 {at:now-3*H+6e4,bot:'plan',kind:'outside',text:'added "Northwind call" to Google Calendar, Wednesday 11:00',thread:'seed'}];
const log=(bot,kind,text,thread,undo)=>{S.activity.push({at:Date.now(),bot,kind,text,thread,undo});if(S.panel||S.left)renderOver()};

const SCRIPTS=[
 {match:t=>/paper|research/i.test(t)&&/summar|write|draft|post/i.test(t),owner:'sch',helpers:['quill'],
  ask:{action:'use the shared browser on arxiv.org',scope:'Browser: arxiv.org'},
  side:[['sch','quill','I have three papers and notes on each. Can you turn them into a five-line summary in the owner\'s voice?'],['quill','sch','Done. Plain, no emoji, one line per paper plus a pick. Sending it back.']],
  reply:'Three recent papers, summarised by Quill. The second is the one to read first: it ships code and a benchmark you can rerun.',learn:['sch','You want papers with code first'],out:['sch','opened 3 pages on arxiv.org']},
 {match:t=>/week|plan|meeting|calendar/i.test(t)&&/mail|inbox|email|client/i.test(t),owner:'plan',helpers:['mail'],
  ask:{action:'read your Gmail',scope:'Gmail: read'},
  side:[['plan','mail','Any client emails this week that need a meeting?'],['mail','plan','Two. Northwind wants a call on Wednesday. An invoice question can wait for email.']],
  reply:'Your week is planned. The Northwind call is on Wednesday at 11:00, after your no-meetings-before-10 rule. Tuesday and Thursday evenings stay free for the gym, and the invoice question is in Mailroom\'s list.',learn:['plan','Client calls go late in the morning'],out:['plan','added "Northwind call" to Google Calendar, Wednesday 11:00',true]}];
function guess(t){const s=SCRIPTS.find(x=>x.match(t));if(s)return s.owner;let best=null,sc=0;BOTS.filter(b=>roleOf(b)==='Bot').forEach(b=>{const n=b.kw.filter(k=>t.toLowerCase().includes(k)).length;if(n>sc){sc=n;best=b}});return best?best.id:null}
function routeFor(t){const s=SCRIPTS.find(x=>x.match(t));if(s)return s;const g=guess(t);
  if(!g)return{owner:'atlas',helpers:[],create:true,reply:'No one here owns this yet. I can handle it once, or hire a bot whose job it is.'};
  return{owner:g,helpers:[],reply:'This is my job, so I took it. Here is what I found.',learn:[g,'You asked: '+t.slice(0,44)]}}

/* ---------- views ---------- */
function botsView(){
  const p=pending();
  const kidsOf=id=>id==='atlas'?BOTS.filter(b=>b.id!=='atlas'&&(b.boss==='atlas'||!b.boss)):BOTS.filter(b=>b.boss===id);
  const node=(b,i)=>{const k=kidsOf(b.id),open=!!S.open[b.id],st=stateOf(b);
    return `<li class="${open?'open':''}" style="--i:${i}"><div class="brow">${k.length?`<button class="tog" data-tog="${b.id}" aria-expanded="${open}" aria-label="${b.name}'s team">${IC.chev}</button>`:'<span class="tog"></span>'}<button class="bmain" data-dm="${b.id}" aria-label="Message ${b.name}">${face(b,b.id==='atlas'?'m':'',st==='waiting'?'wait':undefined)}<span class="w"><b>${b.name}</b><small>${esc(roleOf(b)==='Bot'?short(b):`${roleOf(b)} · ${k.length} ${k.length===1?'report':'reports'}`)}</small></span>${st==='working'?'<span class="st">working</span>':st==='waiting'?'<span class="st wait">waiting on you</span>':''}</button><button class="prof" data-bot="${b.id}">Profile</button></div>${k.length?`<div class="kids" ${open?'':'inert'}><ul>${k.map(node).join('')}</ul></div>`:''}</li>`};
  const nm=id=>{const b=by(id);return `<button class="nm" data-dm="${id}" style="--t:${b.tint}">${esc(b.name)}</button>`};
  const list=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  const waitB=[...new Set(p.map(x=>x.bot))],busy=[...S.busy].filter(id=>!waitB.includes(id));
  let s='';
  if(S.paused)s=`Everything is paused. <button class="nm" data-pause style="--t:var(--violet)">Resume</button>`;
  else{
    if(!busy.includes('atlas')&&!waitB.includes('atlas'))s+=`${nm('atlas')} is on watch. `;
    if(busy.length)s+=`${list(busy.map(nm))} ${busy.length>1?'are':'is'} working. `;

    if(g==='deny'){t.items.splice(t.items.indexOf(work),1);S.busy.delete(owner.id);t.running=false;t.items.push({k:'reply',bot:owner.id,text:`"${r.ask.scope}" is set to Deny for me, so I stopped here. You can change it on my profile.`});up();return}
    if(g!=='always'){const ask={k:'ask',id:'a'+Date.now(),bot:owner.id,action:r.ask.action};
      work.wait=true;t.items.splice(t.items.indexOf(work)+1,0,ask);up();
      const ans=await new Promise(res=>asks[ask.id]=res);work.wait=false;
      ask.done={always:`You allowed ${owner.name} to ${r.ask.action}, always.`,once:'You allowed it once.',no:'You declined.'}[ans];
      if(ans==='always')(S.grants[owner.id]=S.grants[owner.id]||{})[r.ask.scope]='always';
      log(owner.id,'perm',{always:`was set to Always allow for "${r.ask.scope}"`,once:`was allowed "${r.ask.scope}" once`,no:`was declined "${r.ask.scope}"`}[ans],t.id);
      if(ans==='no'){t.items.splice(t.items.indexOf(work),1);S.busy.delete(owner.id);t.running=false;t.items.push({k:'reply',bot:owner.id,text:'Okay. I can answer from what I already know, or you can allow it later from my profile.'});up();return}
      t.items=t.items.filter(x=>x!==ask&&x!==work);t.items.push(ask,work);up();await wait(500)}}
  if(r.side){r.helpers.forEach(h=>S.busy.add(h));
    for(const [f,to,m] of r.side){work.note=`${by(f).name} → ${by(to).name}`;t.items.splice(t.items.indexOf(work),0,{k:'hop',from:f,to,text:m});up();await wait(750)}
    r.helpers.forEach(h=>S.busy.delete(h))}
  t.items.splice(t.items.indexOf(work),1);S.busy.delete(owner.id);t.running=false;
  const ctx=`${owner.mem.length} ${owner.mem.length===1?'memory':'memories'}${r.helpers.length?' and '+r.helpers.map(h=>by(h).name).join(', ')+"'s reply":''}`;
  t.items.push({k:'reply',bot:owner.id,text:r.reply,ctx:r.create?null:ctx,create:r.create});
  if(r.out)log(r.out[0],'outside',r.out[1],t.id,r.out[2]);
  if(r.learn){const b=by(r.learn[0]);b.mem.push(r.learn[1]);b.fresh=b.mem.length-1;t.items.push({k:'mem',bot:b.id,text:r.learn[1]})}
  up();
}
function openDM(id){let t=S.threads.find(x=>x.dm===id);const b=by(id);
  if(!t){t={id:'dm'+id,at:Date.now(),title:b.name,owner:id,dm:id,items:[{k:'note',text:`Direct thread with ${b.name}. Only ${b.name} reads this; it can still ask teammates for help.`}]};S.threads.unshift(t)}
  S.recent=[id,...S.recent.filter(x=>x!==id)];go('thread',t.id)}

/* ---------- palette ---------- */
function palItems(q){
  const all=[...S.threads.map(t=>({label:t.title,hint:'Thread',go:()=>go('thread',t.id)})),
    ...BOTS.map(b=>({label:b.name,hint:'Message · '+(roleOf(b)==='Bot'?short(b):roleOf(b)),face:b,bot:true,go:()=>openDM(b.id)})),
    {label:'Bots',hint:'Page',go:()=>go('bots')},{label:'New thread',hint:'Page',go:()=>go('new')},{label:'Activity',hint:'Page',go:()=>{S.panel='activity';renderOver()}},
    {label:'Company',hint:'Page',go:()=>{S.panel='company';renderOver()}},{label:'Settings',hint:'Page',go:()=>{S.panel='settings';renderOver()}}];
  const pool=S.palBots?all.filter(i=>i.bot):all;q=q.toLowerCase().trim();return q?pool.filter(i=>(i.label+' '+i.hint).toLowerCase().includes(q)):pool}
function renderPal(){const it=palItems($('palIn').value);S.palIdx=Math.min(S.palIdx,Math.max(it.length-1,0));
  $('palList').innerHTML=it.map((i,n)=>`<li><button class="${n===S.palIdx?'hl':''}" data-pal="${n}">${i.face?face(i.face,'s',''):''}<span>${esc(i.label)}</span><small>${esc(i.hint)}</small></button></li>`).join('')||'<li class="sub" style="padding:10px">No matches.</li>'}
function openPal(bots){S.palBots=!!bots;$('palIn').placeholder=bots?'Message a bot':'Jump to a thread, a bot or a page';$('pal').classList.add('show');$('palIn').value='';S.palIdx=0;renderPal();$('palIn').focus()}
function closePal(){$('pal').classList.remove('show')}
$('palIn').addEventListener('input',()=>{S.palIdx=0;renderPal()});
$('palIn').addEventListener('keydown',e=>{const it=palItems($('palIn').value);
  if(e.key==='ArrowDown'){S.palIdx=Math.min(S.palIdx+1,it.length-1);renderPal();e.preventDefault()}
  else if(e.key==='ArrowUp'){S.palIdx=Math.max(S.palIdx-1,0);renderPal();e.preventDefault()}
  else if(e.key==='Enter'&&it[S.palIdx]){closePal();it[S.palIdx].go()}});

/* ---------- events ---------- */
function setLook(l){const app=$('app');app.dataset.look=l;document.querySelectorAll('.looks button').forEach(b=>b.classList.toggle('on',b.dataset.look===l));try{localStorage.setItem('look',l)}catch(e){}renderOver()}
try{const l=localStorage.getItem('look');if(l)$('app').dataset.look=l}catch(e){}
document.addEventListener('click',e=>{
  if(e.target.id==='pal'){closePal();return}
  if(e.target.id==='scrim'){S.left=false;S.panel=null;renderOver();return}
  const el=e.target.closest('button,[role=button]');if(!el)return;const d=el.dataset;
  if(el.closest('.looks')&&d.look){setLook(d.look);return}
  if(d.tog){const li=el.closest('li'),open=!S.open[d.tog];S.open[d.tog]=open;li.classList.toggle('open',open);el.setAttribute('aria-expanded',String(open));const k=li.querySelector(':scope>.kids');if(k)k.inert=!open;return}
  if(d.sec){S.col[d.sec]=!S.col[d.sec];try{localStorage.setItem('drawer-col',JSON.stringify(S.col))}catch(e){}renderOver();return}
  if(d.pal!==undefined){const it=palItems($('palIn').value)[+d.pal];closePal();it&&it.go();return}
  if(d.bot){e.stopPropagation();S.panel=d.bot;S.tab='overview';S.left=false;renderOver();return}
  if(el.id==='fabBot'){S.panel='hire';S.left=false;renderOver();setTimeout(()=>$('panel').querySelector('[name=what]')?.focus(),300)}
  else if(el.id==='fabSet'){S.left=!S.left;S.panel=null;renderOver()}
  else if(el.id==='fabNew'||d.new!==undefined){go('new')}
  else if(d.home!==undefined){go('bots')}
  else if(d.closeall!==undefined){S.left=false;S.panel=null;renderOver()}
  else if(d.panel){S.panel=d.panel;S.left=false;if(by(d.panel))S.tab='overview';renderOver();if(d.sect)setTimeout(()=>$('sect-'+d.sect)?.scrollIntoView({block:'start'}),80)}
  else if(d.palette!==undefined){S.left=false;renderOver();openPal()}
  else if(d.open){go('thread',d.open)}
  else if(d.dm){openDM(d.dm)}
  else if(d.try){send(d.try)}
  else if(d.ans){asks[d.ask]?.(d.ans)}
  else if(d.why){const t=S.threads.find(x=>x.id===d.why);t.why=!t.why;renderMain()}
  else if(d.wrong){const t=S.threads.find(x=>x.id===d.wrong);t.wrong=!t.wrong;renderMain()}
  else if(d.hand){const t=S.threads.find(x=>x.id===d.t),nb=by(d.hand);t.wrong=false;t.owner=nb.id;t.items.push({k:'note',text:`You handed this to ${nb.name}. Atlas will route threads like this to ${nb.name} from now on.`});by('atlas').mem.push(`Threads like "${t.title}" go to ${nb.name}`);t.items.push({k:'reply',bot:nb.id,text:'Got it, this one is mine. Picking up from here.'});render()}
  else if(d.tab){S.tab=d.tab;renderOver()}
  else if(d.filter){S.filter=d.filter;renderOver()}
  else if(d.actall){S.actAll=S.actAll===d.actall?null:d.actall;renderOver()}
  else if(d.forget!==undefined){const b=by(d.b);b.mem.splice(+d.forget,1);b.fresh=null;renderOver()}
  else if(d.pick){const i=$('root').querySelector('input[name=q]');i.value=i.value.replace(/@\w*$/,'@'+by(d.pick).name+' ');$('mention').hidden=true;i.focus();i.dispatchEvent(new Event('input',{bubbles:true}))}
  else if(d.hireFrom){const t=S.threads.find(x=>x.id===d.hireFrom);const nb={id:'b'+Date.now(),name:'Concierge',role:'Bot',boss:'ops',tint:'#e7b3f0',job:'Books tables, tickets and travel.',kw:['book','table','ticket','travel'],mem:['Hired by Atlas from your thread']};BOTS.push(nb);t.owner=nb.id;
    t.items.push({k:'note',text:'Atlas hired Concierge, reporting to Ops lead.'});t.items.push({k:'reply',bot:nb.id,text:'Hi, bookings are mine now. Which restaurant, and what time on Friday?'});log('atlas','bots','hired Concierge under Ops lead',t.id);render()}
  else if(d.pause!==undefined){S.paused=!S.paused;log('atlas','bots',S.paused?'was told to pause all bots':'was told to resume all bots');render()}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-bot]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.dataset.form!==undefined){const v=f.q.value.trim();if(v){f.q.value='';send(v)}}
  else if(f.dataset.hire!==undefined){const what=f.what.value.trim();if(!what)return;const names=['Scout','Pilot','Keeper','Tally','Echo'];const tints=['#9ee0e6','#c6b7f7','#f7b8a8','#b5e3a1'];
    const nb={id:'b'+Date.now(),name:names[BOTS.length%names.length],role:'Bot',boss:f.boss.value||null,tint:tints[BOTS.length%tints.length],job:what.replace(/^./,c=>c.toUpperCase()).replace(/\.?$/,'.'),kw:what.toLowerCase().split(/\W+/).filter(w=>w.length>3),mem:['Hired by you']};
    BOTS.push(nb);log('atlas','bots',`hired ${nb.name}${nb.boss?' under '+by(nb.boss).name:', with no manager'}`);S.panel=nb.id;S.tab='overview';render()}
  else if(f.dataset.addmem){const b=by(f.dataset.addmem),v=f.m.value.trim();if(v){b.mem.push(v);b.fresh=b.mem.length-1;renderOver()}}
});
let pv=0;
document.addEventListener('input',e=>{const i=e.target;if(i.name!=='q')return;
  const m=$('mention'),q=i.value.match(/(?:^|\s)@(\w*)$/);
  if(m){if(!q)m.hidden=true;else{const list=BOTS.filter(b=>b.name.toLowerCase().startsWith(q[1].toLowerCase())).slice(0,6);m.hidden=!list.length;m.innerHTML=list.map((b,n)=>`<button type="button" class="${n===0?'hl':''}" data-pick="${b.id}">${face(b,'s','')}<span>${b.name}</span><small>${esc(roleOf(b)==='Bot'?short(b):roleOf(b))}</small></button>`).join('')}}
  if(i.dataset.preview!==undefined){clearTimeout(pv);pv=setTimeout(()=>{
    const mb=BOTS.find(b=>i.value.toLowerCase().startsWith('@'+b.name.toLowerCase()));const g=mb?mb.id:i.value.trim().length>3?guess(i.value):null;
    if(g===S.preview&&i.value.trim())return;S.preview=g;
    document.querySelectorAll('#lineup .who').forEach(w=>{const b=by(w.dataset.w),on=w.dataset.w===g;w.classList.toggle('on',on);
      const f=w.querySelector('.face');f.classList.toggle('wake',on);f.classList.toggle('sleep',!on&&b.id!=='atlas')});
    $('preview').innerHTML=g?`<b>${esc(by(g).name)}</b> would take this${mb?' (you picked it)':''}. Everyone else stays asleep.`:i.value.trim()?'Atlas will decide who owns this, or offer to hire someone.':'Atlas is listening. The bot whose job it is will wake up.';
  },180)}
});
document.addEventListener('keydown',e=>{const m=$('mention');if(m&&!m.hidden&&(e.key==='Enter'||e.key==='Tab')&&e.target.name==='q'){const f=m.querySelector('button');if(f){e.preventDefault();f.click()}}},true);
document.addEventListener('change',e=>{const s=e.target;
  if(s.dataset.perm){S.grants[s.dataset.perm][s.dataset.scope]=s.value;log(s.dataset.perm,'perm',`was set to ${s.selectedOptions[0].text} for "${s.dataset.scope}"`);renderOver()}
  else if(s.dataset.boss){const b=by(s.dataset.boss);b.boss=s.value||null;log('atlas','bots',`moved ${b.name} ${b.boss?'under '+by(b.boss).name:'to no manager'}`);render()}
  else if(s.dataset.lookSel!==undefined){setLook(s.value)}
  else if(s.dataset.themeSel!==undefined){s.value?document.documentElement.setAttribute('data-theme',s.value):document.documentElement.removeAttribute('data-theme')}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('pal').classList.contains('show')?closePal():openPal()}
  else if(e.key==='Escape'){if($('pal').classList.contains('show'))closePal();else if(S.panel||S.left){S.panel=null;S.left=false;renderOver()}}
});
/* eyes follow the pointer, gently */
let raf=0;document.addEventListener('pointermove',e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;document.documentElement.style.setProperty('--lx',x.toFixed(2));document.documentElement.style.setProperty('--ly',y.toFixed(2))})});

S.threads.push({id:'seed',at:now-3*H,title:'Reply to the Northwind email',owner:'mail',items:[
  {k:'me',text:'Reply to the Northwind email and say we can do Wednesday'},
  {k:'route',owner:'mail',quiet:['plan','sch','quill','ledger']},
  {k:'hop',from:'mail',to:'plan',text:'Northwind confirmed Wednesday. Can you hold 11:00?'},
  {k:'reply',bot:'mail',text:'Sent: "Wednesday works. 11:00?" Planner is holding the slot.',ctx:'2 memories'}]});
document.querySelectorAll('.looks button').forEach(b=>b.classList.toggle('on',b.dataset.look===$('app').dataset.look));
render();
</script>
