<meta charset="utf-8">
<title>Bot Company Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the bots are the home. Floating controls: + new bot (top right), settings and New thread (bottom left).
   A drawer slides in from the left (usage, threads, places); details slide in from the right. Three looks to compare. */
:root{
  --bg:#fbfaf8; --raise:#ffffff; --sunk:#f3f1ed; --line:#ebe7e1; --line2:#ddd8d0;
  --fg:#1c1b19; --soft:#4a4743; --muted:#736e67;
  --mint:#13916a; --mint-soft:#dff4eb; --violet:#6c4cf0; --violet-soft:#efeaff;
  --shadow:0 14px 40px -14px rgba(40,30,10,.25),0 2px 6px -2px rgba(40,30,10,.08);
  --float:0 10px 28px -8px rgba(40,30,10,.28),0 2px 6px rgba(40,30,10,.08);
  --r:18px; --r-s:11px;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --faceShine:1; --faceGlow:0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1a1d; --raise:#232327; --sunk:#1f1f22; --line:#2e2e33; --line2:#3a3a40;
  --fg:#ecebef; --soft:#c6c4cc; --muted:#9e9ca6;
  --mint:#4fd3a4; --mint-soft:#1c3a2f; --violet:#a58cff; --violet-soft:#2b2545;
  --shadow:0 16px 48px -12px rgba(0,0,0,.65),0 2px 8px -2px rgba(0,0,0,.4); --float:0 10px 30px -8px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1a1d; --raise:#232327; --sunk:#1f1f22; --line:#2e2e33; --line2:#3a3a40;
  --fg:#ecebef; --soft:#c6c4cc; --muted:#9e9ca6;
  --mint:#4fd3a4; --mint-soft:#1c3a2f; --violet:#a58cff; --violet-soft:#2b2545;
  --shadow:0 16px 48px -12px rgba(0,0,0,.65),0 2px 8px -2px rgba(0,0,0,.4); --float:0 10px 30px -8px rgba(0,0,0,.7); color-scheme:dark}
/* Ink and paper: warmer paper, crisp ink, editorial serif, flat faces, tighter corners */
.app[data-look="ink"]{--bg:#f6f3ec;--raise:#fffdf7;--sunk:#eeeae1;--line:#e0dace;--line2:#cfc8b9;--fg:#16140f;--soft:#3f3b33;--muted:#6f685c;--mint:#0f7653;--mint-soft:#e2eee5;--violet:#4f30d4;--violet-soft:#ebe6fa;--r:8px;--r-s:6px;--display:"Fraunces",Georgia,serif;--faceShine:0;--shadow:0 1px 0 var(--line2),0 12px 30px -18px rgba(30,20,0,.35);--float:0 1px 0 var(--line2),0 8px 20px -10px rgba(30,20,0,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app[data-look="ink"]{--bg:#191815;--raise:#211f1b;--sunk:#1c1b18;--line:#2f2c26;--line2:#3d3a32;--fg:#efebe2;--soft:#cdc7ba;--muted:#a19a8c;--mint:#5cc99c;--mint-soft:#1d332a;--violet:#a892ff;--violet-soft:#29243d;--shadow:0 1px 0 var(--line2),0 14px 34px -14px rgba(0,0,0,.7);--float:0 10px 26px -8px rgba(0,0,0,.7)}}
:root[data-theme="dark"] .app[data-look="ink"]{--bg:#191815;--raise:#211f1b;--sunk:#1c1b18;--line:#2f2c26;--line2:#3d3a32;--fg:#efebe2;--soft:#cdc7ba;--muted:#a19a8c;--mint:#5cc99c;--mint-soft:#1d332a;--violet:#a892ff;--violet-soft:#29243d;--shadow:0 1px 0 var(--line2),0 14px 34px -14px rgba(0,0,0,.7);--float:0 10px 26px -8px rgba(0,0,0,.7)}
/* Night desk: dark first, tints glow */
.app[data-look="night"]{--bg:#121216;--raise:#1b1b21;--sunk:#16161b;--line:#26262e;--line2:#33333d;--fg:#f1f0f5;--soft:#c9c7d2;--muted:#9a98a6;--mint:#5be0b0;--mint-soft:#163328;--violet:#b29bff;--violet-soft:#272042;--shadow:0 18px 50px -14px rgba(0,0,0,.8);--float:0 12px 34px -8px rgba(0,0,0,.85);color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
option{background:var(--raise);color:var(--fg)}
code{font-size:.92em}
::selection{background:var(--violet-soft);color:var(--fg)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:var(--body);font-size:11px;color:var(--muted);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:17px}

.app{height:100%;background:var(--bg);color:var(--fg);position:relative;overflow:hidden;transition:background .4s var(--ease)}
.view{height:100%;overflow:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) 140px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:30px}

/* faces: characters with role shapes */
.face{--t:#ccc;--s:28px;width:var(--s);height:var(--s);flex:none;position:relative;display:inline-block;border-radius:30%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--t) 90%,#fff),var(--t));box-shadow:inset 0 calc(var(--s) * -.07) 0 rgba(0,0,0,.09);transition:transform .35s var(--ease)}
.app[data-look="ink"] .face{background:color-mix(in srgb,var(--t) 78%,var(--raise))}
.face.primary{border-radius:50%}
.face.mgr{border-radius:0;clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%)}
.face.sh-soft{border-radius:30%}.face.sh-round{border-radius:50%}
.face.sh-hex{border-radius:0;clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%)}
.face.sh-pebble{border-radius:58% 42% 52% 48%/48% 56% 44% 52%}
.face.sh-drop{border-radius:50% 50% 50% 14%}
.face.sh-shield{border-radius:22% 22% 50% 50%}
.face.sh-arch{border-radius:50% 50% 16% 16%}
.face.sh-egg{border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.face.sh-blob{border-radius:63% 37% 54% 46%/55% 48% 52% 45%}
.face.sh-oct{border-radius:0;clip-path:polygon(30% 2%,70% 2%,98% 30%,98% 70%,70% 98%,30% 98%,2% 70%,2% 30%)}
.face.sh-bean{border-radius:46% 54% 40% 60%/60% 40% 60% 40%}
.face .eyes{position:absolute;inset:0;translate:calc(var(--lx,0) * var(--s) * .05) calc(var(--ly,0) * var(--s) * .04);transition:translate .25s var(--ease)}
.face i{position:absolute;top:38%;width:12%;height:21%;background:#1b1a18;border-radius:99px;animation:blink 5s infinite;animation-delay:var(--d,0s)}
.face i:first-child{left:29%}.face i:last-child{right:29%}
.face b{position:absolute;left:41%;width:18%;bottom:24%;height:6%;border-radius:99px;background:#1b1a18;opacity:.5;transition:all .3s var(--ease)}
.face.read i{animation:read 1.1s ease-in-out infinite alternate}
.face.read b{height:9%;width:12%;left:44%;border-radius:50%}
.face.sleep i{height:5%;top:50%;animation:none;opacity:.6}
.face.sleep b{opacity:0}
.face.wake{transform:translateY(-6px) scale(1.08)}
.face.wake b{height:10%;width:20%;left:40%;border-radius:0 0 99px 99px;opacity:.7}
.face.wait{animation:bob 2.4s ease-in-out infinite}
.face.wait .eyes{translate:calc(var(--s) * .07) calc(var(--s) * .07)}
.face.wait b{width:11%;left:44.5%;height:11%;border-radius:50%;opacity:.6}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--violet);animation:dot 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-5deg)}60%{transform:translateY(-1px) rotate(4deg)}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.face.s{--s:20px}.face.m{--s:44px}.face.l{--s:64px}.face.xl{--s:88px}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
@keyframes read{from{translate:-2px 0}to{translate:2px 0}}

/* floating controls */
.fab{position:fixed;z-index:20;display:flex;align-items:center;gap:8px;background:var(--raise);color:var(--fg);box-shadow:var(--float);border-radius:99px;transition:transform .25s var(--ease),bottom .35s var(--ease)}
.fab:hover{transform:translateY(-2px)}
.fab-bot{top:calc(16px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));width:46px;height:46px;justify-content:center}
.fab-bot svg{width:20px;height:20px}
.fab-bot,.fab-new{box-shadow:inset 0 0 0 1px var(--line)}
.fab-me{box-shadow:none;background:none}
.fab-me{top:calc(16px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));width:46px;height:46px;justify-content:center;padding:0;gap:0}
.fab-me .ini{width:46px;height:46px;flex:none}
.ini{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em;color:color-mix(in srgb,var(--fg) 82%,transparent);background:color-mix(in srgb,var(--fg) 12%,var(--raise));box-shadow:none}
.fab-me .badge,.fab-new .badge{position:absolute;top:-3px;right:-3px}
.bbar{position:fixed;z-index:20;left:max(16px,calc(50% - 360px));right:max(16px,calc(50% - 360px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;min-width:0}
.bbar::before{content:'';position:absolute;z-index:-1;left:-16px;right:-16px;top:-30px;bottom:calc(-14px - env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 45%);pointer-events:none}
.is-desk .bbar::before{display:none}
.bbar .fab{position:relative}
.fab-new{width:52px;height:52px;flex:none;justify-content:center;padding:0}
.fab-new .i{width:21px;height:21px}
.spill{flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:99px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);cursor:text;transition:box-shadow .2s}
.spill:focus-within{box-shadow:inset 0 0 0 1.5px var(--violet)}
.spill .i{width:20px;height:20px;color:var(--muted)}
.spill input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--fg)}
.spill input::-webkit-search-cancel-button{display:none}
.sres{position:absolute;left:0;right:0;bottom:62px;max-height:min(60vh,520px);overflow:auto;background:var(--raise);border-radius:20px;box-shadow:0 18px 44px -12px rgba(0,0,0,.55),0 0 0 1px var(--line);padding:6px 10px 10px;animation:menuin .16s ease-out;transform-origin:bottom center}
.sres .thg h4:first-child{margin-top:8px}
.sres .bres{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.sres .bres button{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;padding:8px 0;border-radius:var(--r-s);font-size:12.5px}
.sres .bres button:hover{background:var(--sunk)}
.has-composer .fab-me{display:none}
.thsearch{width:100%;border:0;border-radius:var(--r-s);background:var(--sunk);padding:10px 12px;font-size:14px;color:var(--fg);outline:none}
.thsearch:focus{box-shadow:0 0 0 2px var(--violet)}
.thg h4{margin:16px 0 4px}
.th{display:flex;gap:11px;align-items:center;width:100%;padding:10px 8px;border-radius:var(--r-s);text-align:left}
.th:hover,.th:focus-visible{background:var(--sunk);outline:none}.th.cur{background:color-mix(in srgb,var(--mint) 14%,transparent)}
.th .w{flex:1;min-width:0}.th b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th time{font-size:12px;color:var(--muted);flex:none;align-self:flex-start;margin-top:2px}
.th .wt{color:var(--violet);font-weight:600}
.looks{position:fixed;z-index:20;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;display:flex;gap:2px;background:var(--raise);box-shadow:var(--float);border-radius:99px;padding:4px;font-size:12.5px}
.has-composer .looks{display:none}
.has-composer .bbar,.has-composer .fab-bot{display:none}
.thead .thbtn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--soft);position:relative}
.thead .thbtn:hover{background:var(--sunk);color:var(--fg)}.thead .thbtn .badge{position:absolute;top:-2px;right:-2px}
.looks span{padding:6px 8px 6px 12px;color:var(--muted)}
.looks button{padding:6px 12px;border-radius:99px;color:var(--soft)}
.looks button.on{background:var(--fg);color:var(--bg)}

/* bots home */
.hello{display:flex;align-items:flex-end;gap:16px;padding-right:64px;flex-wrap:wrap}
.hello h1{font-family:var(--display);font-weight:650;font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;line-height:1.05;margin:0;text-wrap:balance}
.app[data-look="ink"] .hello h1{font-weight:500;letter-spacing:-.02em}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--sunk);font-size:12.5px;color:var(--soft)}
.status:hover{background:var(--line)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 20%,transparent)}
.status.paused{background:var(--violet-soft);color:var(--violet)}
.status.paused .dot{background:var(--violet)}
.needs{display:flex;flex-direction:column;gap:8px}
.need{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--violet-soft);text-align:left;width:100%}
.need .w{flex:1;min-width:0}
.need .go{color:var(--violet);font-weight:600;font-size:13px}
.atlas{display:flex;gap:20px;align-items:center;padding:22px;border-radius:calc(var(--r) + 6px);background:linear-gradient(120deg,color-mix(in srgb,#b9a6f5 26%,var(--raise)),var(--raise) 70%);box-shadow:var(--shadow);text-align:left;width:100%}
.app[data-look="ink"] .atlas{background:var(--raise)}
.atlas .w{flex:1;min-width:0}
.atlas h2{font-family:var(--display);font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0}
.app[data-look="ink"] .atlas h2{font-weight:500}
.atlas p{margin:2px 0 0;color:var(--soft);max-width:56ch}
.atlas .cta{margin-top:12px;display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--violet)}
.team h3{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.team h3 button{display:inline-flex;gap:8px;align-items:center;border-radius:8px;padding:2px 4px 2px 2px}
.team h3 button:hover{background:var(--sunk)}
.team h3 small{font-weight:400;color:var(--muted)}
.rowscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;margin:0 -2px}
.card{scroll-snap-align:start;flex:0 0 200px;min-height:196px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:var(--r);background:var(--raise);box-shadow:var(--shadow);text-align:left;position:relative;transition:transform .3s var(--ease)}
.card:hover{transform:translateY(-3px)}
.card .face{margin-bottom:8px}
.card b{font-size:15px;font-weight:600}
.card .job{color:var(--muted);font-size:12.5px;line-height:1.4}
.card .last{margin-top:auto;font-size:12px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .info{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.card .info:hover{background:var(--sunk);color:var(--fg)}
.pill{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.working{background:var(--mint-soft);color:var(--mint)}
.pill.waiting{background:var(--violet-soft);color:var(--violet)}
/* faces sit quietly on dark grey: slightly muted, never glowing */
:root[data-theme="dark"] .face,.app[data-look="night"] .face{filter:saturate(.88) brightness(.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .face{filter:saturate(.88) brightness(.9)}}
/* idle life: sleepers breathe and drift a "z", awake faces glance around now and then */
.face.sleep{animation:breathe 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes breathe{0%,100%{scale:1 1}50%{scale:1.035 .965}}
.face.sleep .eyes::after{content:'z';position:absolute;right:2%;top:-14%;font:700 calc(var(--s) * .3)/1 var(--body);color:var(--muted);opacity:0;animation:zz 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.face.s .eyes::after,.face.mgr .eyes::after{display:none}
@keyframes zz{0%,45%{opacity:0;transform:translate(0,3px)}65%{opacity:.75}100%{opacity:0;transform:translate(4px,-7px)}}
.face:not(.sleep):not(.read):not(.wait) .eyes{animation:glance 9s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes glance{0%,40%,100%{transform:none}46%,57%{transform:translateX(calc(var(--s) * -.06))}63%,72%{transform:translateX(calc(var(--s) * .05))}}
/* point at a sleeping bot and it peeks; any face gives a tiny boop */
:is(.bmain,.seat,.chatmain,.dhead,.orb,.head):hover .face.sleep i{height:21%;top:38%;opacity:1}
:is(.bmain,.seat,.chatmain,.dhead,.orb,.head):hover .face.sleep b{opacity:.5}
:is(.bmain,.seat,.chatmain,.dhead,.orb,.head):hover .face.sleep .eyes::after{display:none}
:is(.bmain,.seat,.chatmain,.dhead,.orb,.head):hover .face{animation:boop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes boop{0%{scale:1}35%{scale:1.06 .94}100%{scale:1}}
:is(.bmain,.seat,.chatmain,.dhead,.btn,.chip){transition:scale .15s ease-out}
:is(.bmain,.seat,.chatmain,.dhead,.btn,.chip):active{scale:.97}
/* bot tree: managers drop down from the primary */
.btree,.btree ul{list-style:none;margin:0;padding:0}
.btree ul{margin-left:22px;padding-left:12px;border-left:1px solid var(--line)}
.brow{display:flex;align-items:center;gap:6px;padding:3px 0}
.tog{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
button.tog:hover{background:var(--sunk);color:var(--fg)}
.tog .chev{width:15px;height:15px;transition:transform .4s var(--ease)}
.open>.brow .tog .chev{transform:rotate(90deg)}
.bmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-s);text-align:left}
.bmain:hover{background:var(--sunk)}
.bmain .w{flex:1;min-width:0}
.bmain b{display:block;font-weight:600;font-size:14.5px}
.bmain small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease) .12s}
.open>.kids{grid-template-rows:1fr;transition-delay:0s}
.kids>ul{overflow:hidden;min-height:0}
.kids>ul>li{opacity:0;transform:translateY(-20px);transition:opacity .18s ease,transform .26s cubic-bezier(.5,0,.75,0)}
.open>.kids>ul>li{opacity:1;transform:none;transition:opacity .3s ease calc(var(--i) * 60ms),transform .6s cubic-bezier(.34,1.5,.64,1) calc(var(--i) * 60ms)}
/* home: a sentence, the team, lately */
.home{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px;padding-top:56px}
.when{font-size:13px;color:var(--muted)}
.roll{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.2;letter-spacing:-.025em;margin:6px 0 0;text-wrap:pretty;max-width:24ch}
.app[data-look="ink"] .roll{font-weight:500}

/* drawer */
.ph .you{flex:1}
.switch{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--r);background:var(--sunk);text-align:left;font-weight:500}

.knob{width:40px;height:24px;flex:none;border-radius:99px;background:var(--mint);position:relative;transition:background .25s}
.knob::after{content:'';position:absolute;top:3px;left:19px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .35s var(--ease)}
.switch[aria-checked="false"] .knob{background:var(--line2)}
.switch[aria-checked="false"] .knob::after{left:3px}
.big{font-family:var(--display);font-size:38px;font-weight:650;letter-spacing:-.03em;line-height:1}
.app[data-look="ink"] .big{font-weight:500}
.big small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:8px}
.stack{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:14px 0 10px}
.stack span{height:100%}
.whoused{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--soft)}
.whoused span{display:inline-flex;gap:6px;align-items:center}

.sw{width:12px;height:12px;border-radius:4px;background:var(--line2);display:inline-block}
.navl .line .w{font-size:14px;color:var(--fg)}
.foot{font-size:12px;color:var(--muted);margin:0}
.use{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
/* faces: cheeks and a catch-light */
.face::before,.face::after{content:'';position:absolute;top:60%;width:16%;height:9%;border-radius:50%;background:rgba(255,105,120,.2);filter:blur(.6px);pointer-events:none}
.face::before{left:15%}.face::after{right:15%}
.face i::after{content:'';position:absolute;top:16%;left:20%;width:30%;height:20%;border-radius:50%;background:#fff;opacity:.7}
.face.sleep i::after{display:none}
/* home ideas */
.hh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-right:56px}
.hh h1{font-family:var(--display);font-weight:650;font-size:30px;letter-spacing:-.025em;margin:2px 0 0}
.app[data-look="ink"] .hh h1{font-weight:500}
.home{gap:32px}
.chip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.cfilt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-18px}
.chats{display:flex;flex-direction:column}
.chat{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:var(--r);text-align:left;width:100%;position:relative}

.chat:hover::before,.chat:hover+.chat::before{opacity:0}
.chat .w{flex:1;min-width:0}
.chat .top{display:flex;align-items:center;gap:6px}
.chat .top b{font-size:15px;font-weight:600}
.chat .pin{color:var(--muted);display:inline-flex}
.chat time{margin-left:auto;font-size:12px;color:var(--muted)}
.chat .prev{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.typing{color:var(--mint);font-style:italic}
.typing .dots i{background:var(--mint)}
.wt{color:var(--violet)}
.orbit{position:relative;width:min(100%,640px);aspect-ratio:1;margin:-10px auto 0}
.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wires line{stroke:var(--line2);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:3 5}
.wires line.live{stroke:var(--mint);stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.orb{position:absolute;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:14px;padding:6px;animation:pop .7s var(--ease) both;animation-delay:calc(var(--i) * 55ms)}
.orb:hover .face{transform:translateY(-3px) scale(1.06)}
.orb .fl{display:block;animation:float 6s ease-in-out infinite;animation-delay:calc(var(--i) * -.8s)}

.orb .st.wait{color:var(--violet)}
.orb.asleep{opacity:.82}
@keyframes pop{from{opacity:0;scale:.5}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.h-desks .head{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--r)}
.h-desks .head b{font-family:var(--display);font-size:20px;font-weight:650}
.h-desks .head small,.seat small,.dhead small{color:var(--muted);font-size:12.5px}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:4px;column-gap:16px;row-gap:0;align-items:start;margin-top:-12px}
.desks>.desk{margin-bottom:16px}
.desk{background:color-mix(in srgb,var(--t) 13%,var(--raise));border-radius:calc(var(--r) + 4px);padding:14px;display:flex;flex-direction:column;gap:12px;animation:pop .6s var(--ease) both;animation-delay:calc(var(--i) * 80ms)}
.dhead{display:flex;gap:12px;align-items:center;text-align:left;padding:4px;border-radius:12px}
.dhead b{display:block;font-weight:600;font-size:15px}
.seats{display:flex;gap:6px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--t) 50%,var(--line2))}
.seat{flex:1 1 96px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;text-align:center}
.seat:hover,.dhead:hover,.h-desks .head:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.seat b{font-size:13.5px;font-weight:600;margin-top:4px}
.seat small{line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:15ch}
.solo-ic{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--t) 22%,transparent)}
.seat{flex:0 1 calc(50% - 3px)}
.desk{min-height:0}
@media (max-width:640px){.orb .nm2{font-size:11px}.orbit .face.l{--s:48px}.orbit .face.xl{--s:64px}}
.pf{position:relative;display:inline-grid;flex:none}
.star{position:absolute;right:-3px;bottom:-3px;width:calc(var(--sz,22px));height:var(--sz,22px);border-radius:50%;background:#f5a524;box-shadow:0 0 0 3px var(--bg);display:grid;place-items:center;pointer-events:none}
.star svg{width:62%;height:62%;fill:#fff}
.pf:has(.face.xl) .star{--sz:28px;right:0;bottom:0}.pf:has(.face.l) .star{--sz:22px}.pf:has(.face.m) .star{--sz:17px;right:-4px;bottom:-4px}
.desk .pf .star,.raise .pf .star{box-shadow:0 0 0 3px var(--raise)}
.shelf{display:flex;justify-content:safe center;gap:clamp(14px,4vw,34px);overflow-x:auto;padding:10px 8px 6px;margin:-6px 0 0;scrollbar-width:none;border-radius:22px;transition:background .2s,box-shadow .2s}
.shelf::-webkit-scrollbar{display:none}
.shelf.drop-on{background:color-mix(in srgb,var(--mint) 10%,transparent);box-shadow:inset 0 0 0 2px var(--mint)!important}
.pin2{display:flex;flex-direction:column;align-items:center;gap:9px;flex:none;width:104px;padding:6px 0;border-radius:var(--r)}

.pin2 small{font-size:12px;color:var(--muted);margin-top:-6px}.pin2 small.wt{color:var(--violet)}
.unpinning{opacity:.55}
@media (max-width:640px){.pin2{width:88px}.pin2 .face.xl{--s:76px}}

.setwrap[hidden]{display:none}
.setdlg{width:min(940px,100%);height:min(720px,100%);background:var(--bg);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px var(--line);display:grid;grid-template-columns:220px 1fr;overflow:hidden;animation:menuin .2s ease-out}

.scard{background:var(--raise);border-radius:14px;padding:4px 16px;box-shadow:inset 0 0 0 1px var(--line)}

.srow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}

@media (max-width:640px){
  .setwrap{padding:0;place-items:stretch}
  .setdlg{width:100%;height:100%;border-radius:0;grid-template-columns:1fr;animation:sheetin .28s var(--ease)}

  .srow.acct{flex-wrap:wrap;padding:14px 0}.srow.acct .w{flex:1 1 calc(100% - 60px)}.srow.acct .btn{flex:1}
}
/* phone settings: Grok-style grouped cards */
.pset{overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 40px;display:flex;flex-direction:column;gap:26px}
.pset>*{flex:none}
.pset .xbig{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);margin-bottom:6px}

@media (max-width:640px){.sbody .scard{border-radius:22px;padding:4px 18px}.sbody .srow{font-size:15.5px;min-height:60px}.sbody .shead .x{width:42px;height:42px;border-radius:50%;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line)}
  .home .hh,.hint{display:none}.home{padding-top:72px}

/* bot profile */
.panel.pro{background:var(--bg)}

.pal.show{display:flex}
.pal .card2{width:min(560px,100%);background:var(--raise);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 16px;font-size:15px;outline:none;caret-color:var(--violet)}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:var(--r-s);text-align:left}
.pal li button.hl,.pal li button:hover{background:var(--sunk)}
.pal li small{margin-left:auto;color:var(--muted);font-size:12px}
.fadein{animation:fade .5s var(--ease) both}
@keyframes fade{from{opacity:.001;translate:0 8px}}

@media (max-width:640px){
  .card{flex-basis:168px;min-height:184px}
  .atlas{padding:16px;gap:14px}
  .hop,.ask,.settled,.mem{margin-left:0}
  .me{max-width:88%}
  .looks span{display:none}
  .looks{left:50%;translate:-50% 0}
  .looks button{padding:6px 9px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

<script>
(()=>{let th=null;try{th=localStorage.getItem('theme')}catch(e){}if(th===null||th)document.documentElement.setAttribute('data-theme',th||'dark')})();
const IC={send:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',info:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>',chev:'<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>',arrow:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'};
const BOTS=[
 {id:'atlas',name:'Atlas',role:'Primary',boss:null,tint:'#b9a6f5',job:'Runs the company. Routes new threads, settles who owns what, hires bots.',kw:[],mem:['You like short answers first, detail after']},
 {id:'ops',name:'Ops lead',role:'Manager',boss:'atlas',tint:'#8fd6bd',job:'Manages inbox and calendar work.',kw:[],mem:['Mailroom flags clients; Planner owns your week']},
 {id:'mail',name:'Mailroom',role:'Bot',boss:'ops',tint:'#f5bf93',job:'Reads and triages your Gmail.',kw:['inbox','email','mail','gmail','client','reply'],mem:['Clients: anyone from @northwind.example','You archive newsletters unread']},
 {id:'plan',name:'Planner',role:'Bot',boss:'ops',tint:'#9fc2f5',job:'Plans your week, meetings and reminders.',kw:['week','meeting','calendar','schedule','plan','tomorrow','remind'],mem:['No meetings before 10:00','Gym on Tuesday and Thursday evenings']},
 {id:'rl',name:'Research lead',role:'Manager',boss:'atlas',tint:'#f2b0cb',job:'Manages research and writing.',kw:[],mem:['Scholar finds, Quill writes']},
 {id:'sch',name:'Scholar',role:'Bot',boss:'rl',tint:'#bfe08c',job:'Finds and reads sources: papers, docs, the web.',kw:['paper','papers','research','source','find','learn','compare','study'],mem:['You trust arXiv and official docs over blogs']},
 {id:'quill',name:'Quill',role:'Bot',boss:'rl',tint:'#f0d978',job:'Writes drafts, summaries and posts.',kw:['write','draft','summary','summarize','summarise','post','blog'],mem:['Your voice: plain, no emoji, short sentences']},
 {id:'ledger',name:'Ledger',role:'Bot',boss:null,tint:'#d9bf9c',job:'Tracks spending and receipts.',kw:['spend','spent','receipt','expense','money','budget','invoice','food'],mem:['Monthly budget: 40,000 (example)']},
];
const GONE=[];const by=id=>BOTS.find(b=>b.id===id)||GONE.find(b=>b.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TINTS=['#9ee0e6','#c6b7f7','#f7b8a8','#b5e3a1','#f5d38a','#f2a7c8','#a9c8f5','#d9c7a8','#f6c49a','#c9c7cf'];
const short=b=>b.job?b.job.split(/[.:]/)[0]:'New, no job yet';

const roleOf=b=>b.id==='atlas'?'Primary':isMgr(b)?'Manager':'Bot';
const chain=id=>{const o=[];let b=by(id);while(b){o.unshift(b);b=b.boss&&by(b.boss)}return o};
const LAY=(()=>{try{return JSON.parse(localStorage.getItem('home-layout')||'{}')}catch(e){return{}}})();
const S={mute:new Set(),home:LAY.def||'tree',def:LAY.def||'tree',order:LAY.order||{},pins:(p=>(p.bots=p.bots||['atlas',...new Set([...(p.chats||[]),...(p.seats||[]),...(p.tree||[])])],p))(Object.assign({desks:[],bots:LAY.pins?undefined:['atlas']},LAY.pins||{})),hidden:LAY.hidden||[],chatF:'all',open:{atlas:true},view:'bots',threads:[],cur:null,left:false,panel:null,tab:'overview',busy:new Set(),paused:false,filter:'outside',actAll:null,palIdx:0,palBots:false,preview:null,recent:['mail','sch','plan'],
  col:(()=>{try{return JSON.parse(localStorage.getItem('drawer-col')||'{}')}catch(e){return{}}})(),
  grants:{mail:{'Gmail: send email':'always','Gmail: read':'always'},plan:{'Google Calendar: edit':'ask'},ledger:{'Pay or spend money':'ask'}},activity:[]};
const faceState=b=>S.busy.has(b.id)?'read':(b.id==='atlas'?'':'sleep');
const face=(b,size='',st)=>b.id==='atlas'&&size&&size!=='s'?`<span class="pf">${face0(b,size,st)}<span class="star" title="Primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></span></span>`:face0(b,size,st);
const SHAPES=[['soft','Rounded square'],['round','Circle'],['hex','Hexagon'],['pebble','Pebble'],['drop','Drop'],['shield','Shield'],['arch','Arch'],['egg','Egg'],['blob','Blob'],['bean','Bean']];
const face0=(b,size='',st)=>`<span class="face ${size} ${b.shape?'sh-'+b.shape:b.id==='atlas'?'primary':isMgr(b)?'mgr':''} ${st===undefined?faceState(b):st}" style="--t:${b.tint};--d:${(b.name.length%5)*.9}s" aria-hidden="true"><span class="eyes"><i></i><i></i></span><b></b></span>`;
const asks={};const $=id=>document.getElementById(id);
const pending=()=>S.threads.flatMap(t=>t.items.filter(i=>i.k==='ask'&&!i.done).map(i=>({...i,thread:t.id})));
const stateOf=b=>pending().some(a=>a.bot===b.id)?'waiting':S.busy.has(b.id)?'working':b.id==='atlas'?'awake':'asleep';

const H=36e5,now=Date.now();
S.activity=[
 {at:now-26*H,bot:'atlas',kind:'bots',text:'hired Ledger, with no manager'},
 {at:now-25*H,bot:'mail',kind:'perm',text:'was set to Always allow for "Gmail: send email"'},
 {at:now-3*H,bot:'mail',kind:'outside',text:'sent an email to Northwind: "Wednesday works. 11:00?"',thread:'seed'},
 {at:now-3*H+6e4,bot:'plan',kind:'outside',text:'added "Northwind call" to Google Calendar, Wednesday 11:00',thread:'seed'}];
const log=(bot,kind,text,thread,undo)=>{S.activity.push({at:Date.now(),bot,kind,text,thread,undo});if(S.panel||S.left)renderOver()};

const SCRIPTS=[
 {match:t=>/paper|research/i.test(t)&&/summar|write|draft|post/i.test(t),owner:'sch',helpers:['quill'],
  ask:{action:'use the shared browser on arxiv.org',scope:'Browser: arxiv.org'},
  side:[['sch','quill','I have three papers and notes on each. Can you turn them into a five-line summary in the owner\'s voice?'],['quill','sch','Done. Plain, no emoji, one line per paper plus a pick. Sending it back.']],
  steps:[['sch','Find recent papers on this and send me notes on each.','Three recent papers with notes. The second ships code and a benchmark.'],['quill','Turn Scholar\'s notes into a five-line summary in the owner\'s voice.','Done. Plain, no emoji, one line per paper plus a pick.']],
  reply:'Three recent papers, summarised by Quill. The second is the one to read first: it ships code and a benchmark you can rerun.',learn:['sch','You want papers with code first'],out:['sch','opened 3 pages on arxiv.org']},
 {match:t=>/week|plan|meeting|calendar/i.test(t)&&/mail|inbox|email|client/i.test(t),owner:'plan',helpers:['mail'],
  ask:{action:'read your Gmail',scope:'Gmail: read'},
  side:[['plan','mail','Any client emails this week that need a meeting?'],['mail','plan','Two. Northwind wants a call on Wednesday. An invoice question can wait for email.']],
  steps:[['mail','Any client emails this week that need a meeting?','Two. Northwind wants a call on Wednesday. An invoice question can wait for email.'],['plan','Plan the week around the Northwind call.','Planned. Northwind on Wednesday at 11:00, after the no-meetings-before-10 rule. Gym evenings stay free.']],
  reply:'Your week is planned. The Northwind call is on Wednesday at 11:00, after your no-meetings-before-10 rule. Tuesday and Thursday evenings stay free for the gym, and the invoice question is in Mailroom\'s list.',learn:['plan','Client calls go late in the morning'],out:['plan','added "Northwind call" to Google Calendar, Wednesday 11:00',true]}];
function guess(t){const s=SCRIPTS.find(x=>x.match(t));if(s)return s.owner;let best=null,sc=0;BOTS.filter(b=>roleOf(b)==='Bot').forEach(b=>{const n=b.kw.filter(k=>t.toLowerCase().includes(k)).length;if(n>sc){sc=n;best=b}});return best?best.id:null}
function routeFor(t){const s=SCRIPTS.find(x=>x.match(t));if(s)return s;const g=guess(t);
  if(!g)return{owner:'atlas',helpers:[],create:true,reply:'No one here owns this yet. I can handle it once, or hire a bot whose job it is.'};
  return{owner:g,helpers:[],reply:'This is my job, so I took it. Here is what I found.',learn:[g,'You asked: '+t.slice(0,44)]}}

/* ---------- views ---------- */
const vis=b=>!S.hidden.includes(b.id);
const kidsOf=id=>(id==='atlas'?BOTS.filter(b=>b.id!=='atlas'&&(b.boss==='atlas'||!b.boss)):BOTS.filter(b=>b.boss===id)).filter(vis);
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);return m<1?'now':m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'};
const lastT=b=>S.threads.filter(t=>t.dm===b.id).sort((x,y)=>(y.at||0)-(x.at||0))[0];
const preview=t=>{if(!t)return '';const it=[...t.items].reverse().find(i=>i.k==='reply'||i.k==='me');return it?(it.k==='me'?'You: ':'')+it.text:''};
const PIN='<svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M12 17v5M9 3h6l-1 6 3 4H7l3-4z"/></svg>';
const GRIP='<svg class="i" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></g></svg>';
const PINI='<svg class="i" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 4H7l3-4z"/></svg>';
const isPin=(k,id)=>S.pins[k].includes(id);
const pinMark=(k,id)=>isPin(k,id)?`<span class="pinmark" title="Pinned" aria-label="Pinned">${PINI}</span>`:'';
const pinBtnOld=(k,b)=>{const on=isPin(k,b.id);return `<button class="pinb ${on?'on':''}" data-pin="${k}:${b.id}" aria-pressed="${on}" aria-label="${on?'Unpin':'Pin'} ${b.name}" title="${on?'Unpin':'Pin to top'}">${PINI}</button>`};
const pinBtn=(k,b)=>pinMark(k,b.id);
const gripBtn=b=>'';
const gripBtnOld=b=>`<button class="grip" data-grip aria-label="Move ${b.name}: drag, or use the arrow keys" title="Drag to move">${GRIP}</button>`;
const arrange=(kind,key,list)=>{const o=S.order[key];const l=o?[...list].sort((x,y)=>{const i=o.indexOf(x.id),j=o.indexOf(y.id);return (i<0?999:i)-(j<0?999:j)}):list;return kind?[...l.filter(b=>isPin(kind,b.id)),...l.filter(b=>!isPin(kind,b.id))]:l};
const saveLayout=()=>{try{localStorage.setItem('home-layout',JSON.stringify({order:S.order,pins:S.pins,def:S.def,hidden:S.hidden}))}catch(e){}};
function shelf(){const pins=arrange(null,'shelf',BOTS.filter(b=>isPin('bots',b.id)&&vis(b)));if(!pins.length)return '';
  const one=(b,sid)=>{const st=stateOf(b);return `<button class="pin2" data-dm="${b.id}"${sid?` data-sid="${b.id}"`:''}>${face(b,'xl',st==='waiting'?'wait':undefined)}<b>${b.name}</b>${st==='working'||st==='waiting'?`<small class="${st==='waiting'?'wt':''}">${st==='waiting'?'waiting on you':'working'}</small>`:''}</button>`};
  return `<div class="shelf" data-sortkey="shelf" aria-label="Pinned bots">${pins.map(b=>one(b,true)).join('')}</div>`}
function treeHome(){
  const row=(b,k,open,flat)=>{const st=stateOf(b);return `<div class="brow">${!flat&&k.length?`<button class="tog" data-tog="${b.id}" aria-expanded="${open}" aria-label="${b.name}'s team">${IC.chev}</button>`:'<span class="tog"></span>'}<button class="bmain" data-dm="${b.id}" aria-label="Message ${b.name}">${face(b,b.id==='atlas'&&!flat?'m':'',st==='waiting'?'wait':undefined)}<span class="w"><b>${b.name}</b><small>${esc(roleOf(b)==='Bot'?short(b):`${roleOf(b)} · ${kidsOf(b.id).length} ${kidsOf(b.id).length===1?'report':'reports'}`)}</small></span>${st==='working'?'<span class="st">working</span>':st==='waiting'?'<span class="st wait">waiting on you</span>':''}</button><button class="prof" data-bot="${b.id}">Profile</button>${pinMark('bots',b.id)}</div>`};
  const node=(b,i)=>{const k=arrange(null,'tree:'+b.id,kidsOf(b.id)),open=!!S.open[b.id];
    return `<li class="${open?'open':''}" style="--i:${i}" data-sid="${b.id}">${row(b,k,open,false)}${k.length||isMgr(b)||b.id==='atlas'?`<div class="kids" ${open?'':'inert'}><ul data-sortkey="tree:${b.id}">${k.map(node).join('')}</ul></div>`:''}</li>`};
  if(isPin('bots','atlas'))return `${shelf()}<section><ul class="btree top" data-sortkey="tree:atlas">${arrange(null,'tree:atlas',kidsOf('atlas')).map(node).join('')}</ul></section>`;
  return `${shelf()}<section><ul class="btree">${node(by('atlas'),0)}</ul></section>`;
}
function chatsHome(){
  const p=pending(),f=S.chatF||'all',mgrs=BOTS.filter(b=>b.boss==='atlas'&&isMgr(b));
  let list=S.order.chats?BOTS:[by('atlas'),...BOTS.filter(b=>b.id!=='atlas').sort((x,y)=>((lastT(y)||{}).at||0)-((lastT(x)||{}).at||0))];
  list=arrange(null,'chats',list).filter(b=>!isPin('bots',b.id));

  <div class="chats" data-sortkey="chats">${list.map(b=>{const st=stateOf(b),t=lastT(b),ask=p.find(x=>x.bot===b.id);
    return `<div class="chat" data-sid="${b.id}"><button class="chatmain" data-dm="${b.id}">${face(b,'m',st==='waiting'?'wait':undefined)}<span class="w"><span class="top"><b>${b.name}</b><time>${t&&t.at?ago(t.at):''}</time></span><span class="prev">${st==='working'?'<span class="typing">working<span class="dots"><i></i><i></i><i></i></span></span>':ask?`<span class="wt">Wants to ${esc(ask.action)}</span>`:esc(preview(t)||short(b))}</span></span>${ask?'<span class="badge">1</span>':''}</button></div>`}).join('')}</div>`;
}
function orbitHome(){
  const P={},L=[],tops=kidsOf('atlas');P.atlas=[50,50];
  tops.forEach((m,i)=>{const a=(-90+i*360/tops.length)*Math.PI/180;P[m.id]=[50+27*Math.cos(a),50+27*Math.sin(a)];L.push(['atlas',m.id]);
    const k=kidsOf(m.id);k.forEach((c,j)=>{const b2=a+(j-(k.length-1)/2)*.62;P[c.id]=[50+43*Math.cos(b2),50+43*Math.sin(b2)];L.push([m.id,c.id])})});
  const ids=Object.keys(P);
  return `<div class="orbit"><svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${L.map(([x,y])=>`<line x1="${P[x][0]}" y1="${P[x][1]}" x2="${P[y][0]}" y2="${P[y][1]}" class="${S.busy.has(y)?'live':''}"/>`).join('')}</svg>
    ${ids.map((id,n)=>{const b=by(id),st=stateOf(b);return `<button class="orb ${st}" data-dm="${id}" style="left:${P[id][0]}%;top:${P[id][1]}%;--i:${n}" aria-label="Message ${b.name}"><span class="fl">${face(b,id==='atlas'?'xl':isMgr(b)?'l':'m',st==='waiting'?'wait':undefined)}</span><span class="nm2">${b.name}</span>${st==='working'||st==='waiting'?`<span class="st ${st==='waiting'?'wait':''}">${st==='waiting'?'waiting on you':'working'}</span>`:''}</button>`}).join('')}</div>`;
}
function desksHome(){
  const a=by('atlas'),tops=kidsOf('atlas'),solo=tops.filter(b=>!isMgr(b));
  const groups=arrange('desks','desks',[...tops.filter(isMgr).map(m=>({id:m.id,name:m.name,m,kids:kidsOf(m.id),tint:m.tint})),...(solo.length?[{id:'solo',name:'Solo desk',kids:solo,tint:'#a9a7b3'}]:[])]);
  const seat=c=>{const st=stateOf(c);return `<button class="seat" data-dm="${c.id}" data-sid="${c.id}">${pinMark('bots',c.id)}${face(c,'l',st==='waiting'?'wait':undefined)}<b>${c.name}</b><small>${st==='working'?'working':st==='waiting'?'waiting on you':esc(short(c))}</small></button>`};

  <div class="desks" data-sortkey="desks">${groups.map((g,n)=>`<section class="desk ${isPin('desks',g.id)?'pinned':''}" data-sid="${g.id}" style="--t:${g.tint};--i:${n}"><div class="dbar">${g.m?`<button class="dhead" data-dm="${g.m.id}">${face(g.m,'m')}<span><b>${g.m.name}</b><small>Manager · ${g.kids.length} ${g.kids.length===1?'report':'reports'}</small></span></button>`:`<div class="dhead"><span class="solo-ic">${face(a,'s','')}</span><span><b>Solo</b><small>Report to Atlas directly · ${g.kids.length} ${g.kids.length===1?'bot':'bots'}</small></span></div>`}${pinBtn('desks',g)}${gripBtn(g)}</div><div class="seats" data-sortkey="team:${g.id}">${arrange(null,'team:'+g.id,g.kids).map(seat).join('')}</div></section>`).join('')}</div>`;
}
function botsView(){
  const v=S.home,d=new Date(),h=d.getHours(),part=h<12?'morning':h<17?'afternoon':'evening';
  const body=v==='chats'?chatsHome():v==='orbit'?orbitHome():v==='desks'?desksHome():treeHome();

const wait=ms=>new Promise(r=>setTimeout(r,ms));

// Who a lead can hand work to: Atlas reaches every bot, a manager reaches its own team.
const TEAM=lead=>{if(lead==='atlas')return BOTS.filter(b=>b.id!=='atlas'&&vis(b));const out=[],walk=id=>BOTS.filter(b=>b.boss===id&&vis(b)).forEach(b=>{out.push(b);walk(b.id)});walk(lead);return out};
function planFor(text,lead){const team=TEAM(lead).map(b=>b.id),s=SCRIPTS.find(x=>x.match(text));
  if(s&&s.steps.every(([id])=>team.includes(id)))return s;

  if(!g&&s){const o=s.steps.map(x=>x[0]).find(id=>team.includes(id));if(o)g=by(o)}
  if(!g)return{create:true,steps:[],reply:lead==='atlas'?'No bot here owns this yet. I can handle it once, or hire a bot whose job it is.':'No one on my team does this yet. I can hire a bot for it, or you can ask Atlas.'};
  return{owner:g.id,steps:[[g.id,text.replace(/^./,c=>c.toUpperCase()),'Done. Here is what I found.']],reply:`${g.name} handled this. Here is the result.`,learn:[g.id,'You asked: '+text.slice(0,44)]}}

  if(ans==='always')(S.grants[b.id]=S.grants[b.id]||{})[ask.scope]='always';
  log(b.id,'perm',{always:`was set to Always allow for "${ask.scope}"`,once:`was allowed "${ask.scope}" once`,no:`was declined "${ask.scope}"`}[ans],t.id);
  if(ans==='no'){t.items.push({k:'reply',bot:b.id,text:'Okay, I stopped. You can allow it later from my profile.'});up();return false}

// A lead (Atlas in a thread, or a lead in its own chat) splits the work, hands each part to a bot, collects the replies and answers you.
// The handoffs show as one line that keeps updating, then fold into a single summary you can open.
async function orchestrate(t,text,lead){const p=planFor(text,lead),L=by(lead);
  const pg={k:'prog',id:'p'+Date.now(),lead,log:[],cur:null};t.items.push(pg);
  const say=async(bot,line,ms,busy=true)=>{pg.cur={bot,text:line};if(busy)S.busy.add(bot);up();await wait(ms);S.busy.delete(bot)};
  const stop=()=>{pg.done=true;pg.cur=null;if(!pg.log.length)t.items.splice(t.items.indexOf(pg),1);t.running=false;up()};
  await say(lead,`${L.name} is working out who does what`,900);
  if(p.create){stop();t.items.push({k:'reply',bot:lead,text:p.reply,create:true});up();return}
  for(const [id,task,report] of p.steps){const b=by(id);
    pg.log.push({from:lead,to:id,text:task});await say(lead,`Asking ${b.name}: ${task}`,1100,false);
    await say(id,`${b.name} is on it`,900);
    if(p.ask&&id===p.owner){pg.cur={bot:id,text:`${b.name} needs your OK`,wait:true};up();if(!await needOK(t,b,p.ask)){stop();return}await say(id,`${b.name} is on it`,600)}

async function direct(t,text,id){const b=by(id),s=SCRIPTS.find(x=>x.match(text)&&x.steps.some(y=>y[0]===id));

  t.items.push({k:'reply',bot:id,text:s?s.steps.find(y=>y[0]===id)[2]:'Done. Here is what I did.',ctx:`${b.mem.length} ${b.mem.length===1?'memory':'memories'}`});

async function send(text){

  S.view='thread';S.cur=t.id;S.preview=null;t.running=true;t.at=Date.now();t.items.push({k:'me',text});render();
